<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Lauterbrunnen — Travel Plan</title>
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --red: #ef4444;
  --red-light: #fee2e2;
  --red-dark: #991b1b;
  --orange: #f97316;
  --orange-light: #fef3c7;
  --orange-dark: #92400e;
  --green: #22c55e;
  --green-light: #dcfce7;
  --green-dark: #166534;
  --blue: #3b82f6;
  --blue-light: #dbeafe;
  --blue-dark: #1e40af;
  --purple: #8b5cf6;
  --purple-light: #ede9fe;
  --dark: #0f172a;
  --text: #1e293b;
  --muted: #94a3b8;
  --border: #e2e8f0;
  --light-bg: #f8fafc;
  --card-bg: #ffffff;
  --radius: 12px;
  --photo-ratio: 4 / 3;
  --thumb-size: 72px;
  --cover-height: 150px;
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
  --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
  --shadow-lg: 0 8px 24px rgba(0,0,0,0.12);
  --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
}

html { scroll-behavior: smooth; }

body {
  font-family: var(--font);
  background: var(--light-bg);
  color: var(--text);
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  align-items: center;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

.container {
  width: 100%;
  max-width: 480px;
  padding: 0 20px 32px;
  flex: 1;
  display: flex;
  flex-direction: column;
}

.app-header {
  width: 100%;
  background: var(--dark);
  position: sticky;
  top: 0;
  z-index: 100;
}
.app-header .accent-bar {
  height: 3px;
  background: linear-gradient(90deg, var(--red), var(--orange), var(--blue), var(--purple));
}
.app-header .header-content {
  max-width: 480px;
  margin: 0 auto;
  padding: 14px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.nav-pill {
  background: rgba(255,255,255,0.1);
  color: rgba(255,255,255,0.7);
  border: none;
  padding: 6px 14px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s;
  font-family: var(--font);
}
.nav-pill.active { background: rgba(255,255,255,0.2); color: #fff; }
.nav-links { display: flex; gap: 6px; align-items: center; }

.sync-pill {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 0;
  border-radius: 0;
  background: transparent;
  color: rgba(255,255,255,0.55);
  font-size: 12px;
  font-weight: 500;
  margin-left: auto;
  pointer-events: none;
}
.sync-pill[hidden] { display: none; }
.sync-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--green);
}
.sync-dot { background: rgba(255,255,255,0.35); }
.sync-pill.is-together { color: rgba(255,255,255,0.85); }
.sync-pill.is-together .sync-dot { background: var(--green); }
.sync-pill.is-offline .sync-dot { background: var(--red); }

[contenteditable] {
  outline: none;
  cursor: text;
  min-width: 1em;
}
[contenteditable]:focus {
  outline: none;
  box-shadow: none;
}
[contenteditable]:empty::before {
  content: attr(data-ph);
  color: var(--muted);
  font-style: italic;
  pointer-events: none;
}
[data-display]:empty::before {
  content: attr(data-ph);
  color: var(--muted);
  font-style: italic;
}
.cover-overlay [contenteditable]:empty::before {
  color: rgba(255,255,255,0.55);
}
.hero-day h2[contenteditable] {
  color: var(--dark);
  font-style: normal;
}
.subtitle[contenteditable]:not(:empty) { color: var(--text); font-style: normal; }
.tip[contenteditable]:not(:empty) { color: var(--blue-dark); font-style: normal; }
.chip[contenteditable] { min-width: 0; min-height: 1.4em; width: max-content; }
.chip[contenteditable]:empty { min-width: 2.2em; }

.toast {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--dark);
  color: #fff;
  font-size: 13px;
  font-weight: 500;
  padding: 10px 16px;
  border-radius: 999px;
  box-shadow: var(--shadow-lg);
  z-index: 200;
  display: none;
  max-width: 90vw;
  text-align: center;
}
.toast.show { display: block; }

.name-gate {
  position: fixed;
  inset: 0;
  z-index: 300;
  background: rgba(15, 23, 42, 0.55);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.name-gate[hidden] { display: none; }
.name-card {
  width: min(360px, 100%);
  background: #fff;
  border-radius: var(--radius);
  box-shadow: var(--shadow-lg);
  padding: 22px 20px 18px;
}
.name-card h2 { margin-bottom: 6px; }
.name-card p { color: var(--muted); font-size: 14px; margin-bottom: 16px; }
.name-card input {
  width: 100%;
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 12px 14px;
  font-size: 16px;
  font-family: var(--font);
  margin-bottom: 12px;
  outline: none;
  color: var(--text);
}
.name-card .btn-primary { margin-bottom: 0; }

.screen { display: none; flex-direction: column; flex: 1; }
.screen.active { display: flex; }
.screen.active:not(#screen-home) { padding-top: 8px; }

.fade-in {
  opacity: 0;
  transform: translateY(16px);
  animation: fadeUp 0.5s ease forwards;
}
@keyframes fadeUp {
  to { opacity: 1; transform: translateY(0); }
}

h1 {
  font-size: 32px;
  font-weight: 800;
  letter-spacing: -0.5px;
  color: var(--dark);
  line-height: 1.2;
}
h2 {
  font-size: 22px;
  font-weight: 700;
  letter-spacing: -0.3px;
  color: var(--dark);
  margin-bottom: 8px;
}
h3 {
  font-size: 16px;
  font-weight: 700;
  color: var(--dark);
  margin-bottom: 6px;
}
.overline {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  color: var(--muted);
  font-weight: 600;
  margin-bottom: 8px;
}
.subtitle {
  color: var(--muted);
  font-size: 15px;
  line-height: 1.6;
}

/* Placeholder text — replace the content, then this styling stops applying */
.ph { color: var(--muted); font-weight: 400; font-style: italic; }

/* ─── Cover ─── */
.cover {
  position: relative;
  width: 100%;
  height: 280px;
  overflow: hidden;
  margin-bottom: 20px;
  background: linear-gradient(160deg, #1e293b, #0f172a);
}
.cover img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
.cover-empty {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  color: rgba(255,255,255,0.45);
  font-size: 13px;
  font-style: italic;
  text-align: center;
  padding: 0 24px;
}
.cover-overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, rgba(15,23,42,0.15) 0%, rgba(15,23,42,0.72) 100%);
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  padding: 20px;
  color: #fff;
}
.cover-overlay .overline { color: rgba(255,255,255,0.75); }
.cover-overlay .overline { font-size: 13px; }
.cover-dates {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 8px;
}
.cover-dates .overline { margin-bottom: 0; }
.cover-dates-icon { font-size: 16px; line-height: 1; }
.cover-overlay h1 {
  color: #fff;
  font-size: 40px;
  line-height: 1.05;
  margin-bottom: 8px;
}
.cover-overlay > p {
  color: rgba(255,255,255,0.85);
  font-size: 18px;
  line-height: 1.35;
}
.cover-overlay .ph { color: rgba(255,255,255,0.6); }

/* ─── Cards ─── */
.card {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow-sm);
  transition: box-shadow 0.2s, transform 0.2s;
}
.card:hover { box-shadow: var(--shadow-md); }
.card-lift { cursor: pointer; text-align: start; width: 100%; font-family: var(--font); color: inherit; }
.card-lift:hover { transform: translateY(-2px); }

.day-card {
  display: flex;
  gap: 8px;
  padding: 14px 14px 14px 16px;
  margin-bottom: 10px;
  align-items: flex-start;
}
.day-card-body { flex: 1; min-width: 0; }
.day-card h3 { margin-bottom: 0; }
.day-card-head {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  margin-bottom: 4px;
}
.day-card-head .day-card-tags {
  margin-top: 0;
}
.day-card p {
  font-size: 15px;
  color: var(--muted);
  line-height: 1.55;
}
.day-card-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  margin-top: 9px;
}
.day-card-tags:empty { display: none; }
.day-card-tags .chip {
  font-size: 10px;
  padding: 3px 8px;
}
.day-card .trash-btn { align-self: center; }

.icon-btn {
  flex-shrink: 0;
  width: 28px;
  height: 28px;
  border: none;
  border-radius: 999px;
  background: transparent;
  color: var(--muted);
  font-size: 17px;
  line-height: 1;
  font-family: var(--font);
  cursor: pointer;
  opacity: 0.55;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 0;
  transition: opacity 0.15s, background 0.15s, color 0.15s;
}
.icon-btn:hover { opacity: 1; background: #fee2e2; color: #b91c1c; }
.trash-icon {
  width: 15px;
  height: 15px;
  display: block;
}

/* ─── Buttons ─── */
.btn {
  display: block;
  width: 100%;
  padding: 14px 18px;
  border: 2px solid var(--border);
  border-radius: var(--radius);
  background: var(--card-bg);
  color: var(--text);
  font-size: 15px;
  font-weight: 500;
  font-family: var(--font);
  cursor: pointer;
  text-align: left;
  margin-bottom: 10px;
  transition: all 0.15s ease;
  box-shadow: var(--shadow-sm);
}
.btn:active { transform: scale(0.98); }
.btn-primary {
  background: var(--dark);
  color: #fff;
  border-color: var(--dark);
  text-align: center;
  font-weight: 600;
  box-shadow: var(--shadow-md);
}
.btn-primary:hover { background: #1e293b; }
.btn-outline {
  background: transparent;
  border-color: var(--border);
  color: var(--text);
  text-align: center;
  font-weight: 500;
}
.btn-outline:hover { border-color: var(--muted); background: var(--light-bg); }

.back-link {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  color: var(--muted);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  margin: 16px 0 12px;
  background: none;
  border: none;
  font-family: var(--font);
  padding: 0;
}
.back-link:hover { color: var(--text); }

/* ─── Day page ─── */
.hero-day { margin-bottom: 18px; }
.day-title-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  margin-bottom: 8px;
}
.day-title-row h2 {
  margin-bottom: 0;
  flex: 0 1 auto;
}
.day-title-row .chips {
  margin: 0;
  flex: 1 1 auto;
}

.chips {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
  margin: 10px 0 18px;
}
.chip-add {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--muted);
  background: transparent;
  border: 1px dashed var(--border);
  border-radius: 999px;
  padding: 4px 10px;
  font-family: var(--font);
  cursor: pointer;
  transition: border-color 0.15s, color 0.15s;
}
.chip-add:hover { border-color: var(--blue); color: var(--blue-dark); }
.chip {
  display: inline-block;
  width: max-content;
  max-width: 100%;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--blue-dark);
  background: var(--blue-light);
  border-radius: 999px;
  padding: 4px 8px;
  white-space: nowrap;
}
.chip-shell {
  display: inline-flex;
  align-items: center;
  width: max-content;
  max-width: 100%;
  flex: 0 0 auto;
  background: var(--blue-light);
  border-radius: 999px;
}
.chip-shell .chip { padding-right: 4px; }
.chip-remove {
  width: 22px;
  height: 22px;
  margin-right: 3px;
  border: 0;
  border-radius: 999px;
  background: transparent;
  color: var(--blue-dark);
  font-size: 15px;
  line-height: 1;
  cursor: pointer;
  opacity: 0.6;
}
.chip-remove:hover { opacity: 1; background: rgba(255,255,255,0.65); }
/* The photo link and the tags share the line under the cover. */
.slot-meta {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 10px;
}
.slot-meta .image-picker { margin-top: 0; }
.slot-tags {
  margin: 0;
}

.day-highlights {
  color: var(--muted);
  font-size: 16px;
  line-height: 1.6;
  margin-bottom: 8px;
}

.day-gallery {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  scroll-snap-type: x mandatory;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
  padding-bottom: 2px;
  margin: 0 0 18px;
}
.day-gallery::-webkit-scrollbar { display: none; }
.day-gallery:empty { display: none; }
.gallery-thumb {
  flex: 0 0 var(--thumb-size);
  aspect-ratio: 1 / 1;
  padding: 0;
  border: 1px solid var(--border);
  border-radius: 10px;
  overflow: hidden;
  background: var(--light-bg);
  scroll-snap-align: start;
  cursor: zoom-in;
}
.gallery-thumb img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.lightbox {
  position: fixed;
  inset: 0;
  z-index: 250;
  display: none;
  align-items: center;
  justify-content: center;
  background: rgba(9, 13, 25, 0.92);
  padding: 24px 12px;
}
.lightbox.open { display: flex; }
.lightbox img {
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
  border-radius: 12px;
}
.lightbox-btn {
  position: absolute;
  border: 0;
  border-radius: 999px;
  width: 42px;
  height: 42px;
  font-size: 20px;
  color: #0f172a;
  background: rgba(255,255,255,0.92);
  cursor: pointer;
}
.lightbox-close { top: 16px; right: 16px; }
.lightbox-prev { left: 12px; }
.lightbox-next { right: 12px; }
.lightbox-btn[hidden] { display: none; }

.timeline { display: flex; flex-direction: column; gap: 10px; }
.timeline:not(:empty) { margin-bottom: 10px; }
.slot { padding: 14px 16px; }
.slot .slot-actions { float: right; display: flex; align-items: center; gap: 2px; margin: -4px -6px 0 4px; }
.slot[dir="rtl"] .slot-actions { float: left; margin: -4px 4px 0 -6px; }
.slot[dir="rtl"] ul { margin: 8px 18px 0 0; }
.drag-handle {
  width: 28px;
  height: 28px;
  border: 0;
  border-radius: 999px;
  background: transparent;
  color: var(--muted);
  cursor: grab;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 0;
  opacity: 0.55;
  touch-action: none;
}
.drag-handle:hover, .drag-handle:focus-visible { opacity: 1; background: var(--light-bg); }
.drag-handle svg { width: 15px; height: 15px; display: block; }
.slot.dragging {
  opacity: 0.9;
  box-shadow: var(--shadow-lg);
  cursor: grabbing;
}
.timeline.is-dragging .slot:not(.dragging) { transition: transform 0.12s ease; }
.heart-btn {
  width: 28px;
  height: 28px;
  border: 0;
  border-radius: 999px;
  background: transparent;
  color: var(--muted);
  font-size: 16px;
  line-height: 1;
  cursor: pointer;
}
.heart-btn.is-on { color: var(--red); }
.heart-names {
  display: block;
  clear: both;
  margin: 8px 0 0;
  font-size: 11px;
  color: var(--muted);
}
.heart-names:empty { display: none; }

.heart-filters {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin: 0 0 14px;
}
.heart-filter {
  border: 1px solid var(--border);
  background: #fff;
  color: var(--text);
  border-radius: 999px;
  padding: 6px 12px;
  font-size: 12px;
  font-weight: 700;
  font-family: var(--font);
  cursor: pointer;
}
.heart-filter.is-on {
  background: var(--red-light);
  border-color: #fecaca;
  color: var(--red-dark);
}
.heart-item {
  padding: 14px 16px;
  margin-bottom: 10px;
  cursor: pointer;
  text-align: left;
  width: 100%;
  font-family: var(--font);
  color: inherit;
}
.heart-item .muted { font-size: 12px; color: var(--muted); margin-top: 4px; }
.heart-empty { color: var(--muted); font-size: 14px; line-height: 1.6; }
/* The photo caps the card like a cover: cropped here, full size on tap. */
.slot-image {
  position: relative;
  margin: -14px -16px 12px;
}
.slot-image[hidden] { display: none; }
.slot-image img {
  display: block;
  width: 100%;
  height: var(--cover-height);
  object-fit: cover;
  border-radius: var(--radius) var(--radius) 0 0;
  cursor: zoom-in;
}
.slot-image .image-remove {
  position: absolute;
  top: 8px;
  right: 8px;
  width: 26px;
  height: 26px;
  font-size: 15px;
  opacity: 0.95;
  background: #fff;
  box-shadow: var(--shadow-sm);
}
.slot[dir="rtl"] .slot-image .image-remove { right: auto; left: 8px; }
.image-picker {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  margin-top: 10px;
  color: var(--blue-dark);
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
}
.image-picker input { display: none; }
.slot-time {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--purple);
  margin-bottom: 4px;
}
.slot p { font-size: 16px; color: var(--text); line-height: 1.65; }
.slot ul {
  margin: 8px 0 0 18px;
  font-size: 16px;
  color: var(--text);
}
.slot li { margin-bottom: 4px; }

.tip {
  background: var(--blue-light);
  border: 1px solid #bfdbfe;
  border-radius: var(--radius);
  padding: 12px 14px;
  font-size: 13px;
  color: var(--blue-dark);
  line-height: 1.55;
  margin-bottom: 12px;
}

.section-label {
  font-size: 13px;
  font-weight: 700;
  color: var(--dark);
  margin: 8px 0 10px;
}

.add-day {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  width: 100%;
  padding: 16px;
  margin-bottom: 10px;
  border: 1px dashed var(--border);
  border-radius: var(--radius);
  background: transparent;
  color: var(--muted);
  font-size: 14px;
  font-weight: 600;
  font-family: var(--font);
  cursor: pointer;
  transition: border-color 0.15s, color 0.15s, background 0.15s;
}
.add-day:hover {
  border-color: var(--blue);
  color: var(--blue-dark);
  background: var(--blue-light);
}
.add-card { padding: 12px; font-size: 13px; margin-bottom: 18px; }
.add-options {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-bottom: 18px;
}
.add-options .add-day { margin: 0; padding: 12px 8px; font-size: 13px; }

.doc-card { padding: 14px 16px; margin-bottom: 10px; }
.doc-card .trash-btn { float: right; }
.doc-preview {
  display: block;
  width: 100%;
  aspect-ratio: var(--photo-ratio);
  object-fit: cover;
  border-radius: 10px;
  margin: 0 0 10px;
  border: 1px solid var(--border);
}
.doc-file {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 0 0 10px;
  padding: 10px 12px;
  border-radius: 10px;
  background: var(--light-bg);
  color: var(--blue-dark);
  font-size: 13px;
  font-weight: 600;
  text-decoration: none;
}
.doc-empty { color: var(--muted); font-size: 14px; line-height: 1.6; margin-bottom: 14px; }
.full-day-import {
  background: #fff;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow-sm);
  padding: 14px;
  margin-bottom: 18px;
}

<script>
function liveHearts(slot) {
  return (slot.hearts || []).filter(function (heart) {
    return !heart.fields || !heart.fields.removed || heart.fields.removed.v !== '1';
  });
}

function userHeart(slot, userId) {
  return (slot.hearts || []).find(function (heart) {
    return heart.id === userId;
  });
}

function hasHeart(slot, userId) {
  var heart = userHeart(slot, userId);
  if (!heart) return false;
  return !heart.fields || !heart.fields.removed || heart.fields.removed.v !== '1';
}

function toggleHeart(slot, user, now) {
  now = now || Date.now();
  if (!slot.hearts) slot.hearts = [];
  var existing = userHeart(slot, user.id);
  if (!existing) {
    slot.hearts.push({
      id: user.id,
      created: now,
      fields: {
        name: { v: user.name || '', t: now },
        removed: { v: '', t: now }
      }
    });
    return true;
  }
  var on = hasHeart(slot, user.id);
  existing.fields.removed = { v: on ? '1' : '', t: now };
  if (user.name) existing.fields.name = { v: user.name, t: now };
  return !on;
}

function isRemoved(owner) {
  return !!(owner && owner.fields && owner.fields.removed && owner.fields.removed.v === '1');
}

function fieldValue(owner, key, fallback) {
  if (!owner || !owner.fields || !owner.fields[key] || !owner.fields[key].v) return fallback || '';
  return owner.fields[key].v;
}

function heartUsers(plan) {
  var byId = {};
  (plan.days || []).forEach(function (day) {
    if (isRemoved(day)) return;
    (day.slots || []).forEach(function (slot) {
      if (isRemoved(slot)) return;
      liveHearts(slot).forEach(function (heart) {
        byId[heart.id] = {
          id: heart.id,
          name: fieldValue(heart, 'name', 'Someone')
        };
      });
    });
  });
  return Object.keys(byId).map(function (id) { return byId[id]; }).sort(function (a, b) {
    return a.name.localeCompare(b.name);
  });
}

function heartList(plan, userId) {
  var items = [];
  (plan.days || []).forEach(function (day) {
    if (isRemoved(day)) return;
    (day.slots || []).forEach(function (slot) {
      if (isRemoved(slot)) return;
      var hearts = liveHearts(slot);
      if (!hearts.length) return;
      if (userId && !hearts.some(function (heart) { return heart.id === userId; })) return;
      items.push({
        dayId: day.id,
        slotId: slot.id,
        dayName: fieldValue(day, 'name', 'Untitled day'),
        title: fieldValue(slot, 'title', 'Untitled activity'),
        time: fieldValue(slot, 'time', ''),
        hearts: hearts.map(function (heart) {
          return { id: heart.id, name: fieldValue(heart, 'name', 'Someone') };

    });
  });
  return items;

  return !!isShared && !(user && String(user.name || '').trim());
}

function saveUser(existing, name, makeId) {
  var trimmed = String(name || '').replace(/\s+/g, ' ').trim();

  module.exports = {
    liveHearts: liveHearts,
    hasHeart: hasHeart,
    toggleHeart: toggleHeart,
    heartUsers: heartUsers,
    heartList: heartList,
    needsName: needsName,
    saveUser: saveUser

}
</script>

<script>
/* Who else has this plan open right now. Each browser pings the shared
   notification topic every few seconds; a ping that stops arriving ages out. */
function notePeer(peers, peer, now) {
  if (!peer || !peer.client) return peers;
  peers[peer.client] = { name: String(peer.name || '').trim() || 'Someone', t: now || Date.now() };
  return peers;
}

function dropPeer(peers, client) {
  delete peers[client];
  return peers;
}

function activePeers(peers, now, ttl) {
  return Object.keys(peers || {})
    .filter(function (client) { return (now - peers[client].t) <= ttl; })
    .map(function (client) { return { client: client, name: peers[client].name }; })
    .sort(function (a, b) { return a.name.localeCompare(b.name); });
}

function presenceLabel(peers, now, ttl) {
  var here = activePeers(peers, now, ttl);
  if (!here.length) return 'Only you';
  if (here.length === 1) return here[0].name + ' is here';
  if (here.length === 2) return here[0].name + ' and ' + here[1].name + ' are here';

}

if (typeof module !== 'undefined' && module.exports) {

<script>
var CLOCK = '(?:[01]?\\d|2[0-3])[:.]\\d{2}(?:\\s*(?:am|pm))?';
var WORD_TIME = 'morning|midday|noon|afternoon|evening|night|בוקר|צהריים|אחר הצהריים|אחה"צ|ערב|לילה';
var DAY_TIME = '(?:' + WORD_TIME + '|' + CLOCK + ')';
var TIME_ONLY = new RegExp('^' + DAY_TIME + '$', 'i');
var TIME_PREFIX = new RegExp('^(' + DAY_TIME + ')(?:\\s*[-–—:|]\\s*|\\s+)(.+)$', 'i');
var TITLE_MAX = 70;

/* Text copied from Google Maps drags its own footer along. */
function stripClutter(text) {
  return String(text || '')
    .replace(/map data\s*©\s*\d{4}\s*google/gi, ' ')
    .replace(/\bterms\s*\d+\s*(?:m|km|ft|mi)\b/gi, ' ')
    .replace(/\bkeyboard shortcuts\b/gi, ' ')
    .replace(/[ \t]{2,}/g, ' ');
}

function cleanLines(text) {
  return String(text || '')
    .replace(/\r\n?/g, '\n')
    .split('\n')
    .map(function (line) { return line.trim(); })
    .filter(Boolean);
}

/* Split on sentence punctuation, but only when a space follows, so
   "1.5 km" and "Militärstrasse 76." behave differently. */
function splitSentences(text) {
  var out = [];
  var current = '';
  for (var i = 0; i < text.length; i++) {
    var ch = text.charAt(i);
    current += ch;
    if ('.!?…'.indexOf(ch) === -1) continue;
    var next = text.charAt(i + 1);
    if (next === '' || /\s/.test(next)) {
      out.push(current.trim());
      current = '';
    }
  }
  if (current.trim()) out.push(current.trim());
  return out.filter(Boolean);
}

/* Keep titles scannable: the opening clause is the title and the
   remainder of a long sentence becomes the detail. */
function splitTitle(text) {
  if (text.length <= TITLE_MAX) return { title: text, detail: '' };

  var colon = text.indexOf(':');
  if (colon > 0 && colon <= 40) {
    return { title: text.slice(0, colon).trim(), detail: text.slice(colon + 1).trim() };
  }

  var cut = -1;
  [',', '،', ';', ' — ', ' – ', ' - '].forEach(function (mark) {
    var at = text.indexOf(mark);
    if (at > 0 && at <= TITLE_MAX && (cut === -1 || at < cut)) cut = at;
  });
  if (cut === -1) {
    cut = text.lastIndexOf(' ', TITLE_MAX);
    if (cut <= 0) cut = TITLE_MAX;
  }
  return {
    title: text.slice(0, cut).trim(),
    detail: text.slice(cut).replace(/^[\s,،;–—-]+/, '').trim()
  };
}

  var match = line.match(TIME_PREFIX);
  var time = match ? match[1] : '';
  var body = match ? match[2] : line;
  var split = splitTitle(body);

  var lines = cleanLines(section);
  if (!lines.length) return null;
  if (TIME_ONLY.test(lines[0]) && lines.length > 1) {

      title: lines[1],
      detail: lines.slice(2).join('\n')
    };

  var first = parseLine(lines[0]);
  first.detail = [first.detail].concat(lines.slice(1)).filter(Boolean).join('\n');

  var normalized = stripClutter(String(text || '').replace(/\r\n?/g, '\n')).trim();

  var sections = normalized.split(/\n\s*\n+/).filter(function (section) { return section.trim(); });

  if (allLines.length === 1) return splitSentences(allLines[0]).map(parseLine);

  // own is the exception: it labels the title and details that follow.
  if (sections.length === 1 && !(TIME_ONLY.test(allLines[0]) && allLines.length > 1)) {
    return allLines.map(parseLine);
  }

}

function isBlankActivity(slot) {
  if (!slot || !slot.fields) return true;
  var hasText = ['time', 'title', 'detail', 'image'].some(function (key) {
    var field = slot.fields[key];
    return field && String(field.v || '').trim();
  });
  if (hasText) return false;
  return !(slot.hearts || []).some(function (heart) {
    return !(heart.fields && heart.fields.removed && heart.fields.removed.v === '1');

</script>

  var out = {};
  var keys = {};
  Object.keys(mine || {}).forEach(function (k) { keys[k] = 1; });
  Object.keys(theirs || {}).forEach(function (k) { keys[k] = 1; });
  Object.keys(keys).forEach(function (k) {
    var a = (mine || {})[k];
    var b = (theirs || {})[k];
    if (!a) { out[k] = b; return; }
    if (!b) { out[k] = a; return; }
    out[k] = (b.t > a.t) ? b : a;
  });
  return out;
}

/* Union two lists of {id, created, fields}: shared ids merge field
   by field, ids only one side has are kept, order stays by creation. */
function mergeList(mine, theirs, mergeItem) {
  var byId = {};
  var order = [];
  [mine || [], theirs || []].forEach(function (list) {
    list.forEach(function (item) {
      if (!item || !item.id) return;
      if (byId[item.id]) {
        byId[item.id] = mergeItem(byId[item.id], item);
      } else {
        byId[item.id] = item;
        order.push(item.id);
      }
    });
  });
  return order.map(function (id) { return byId[id]; }).sort(function (a, b) {
    return (a.created || 0) - (b.created || 0) || (a.id < b.id ? -1 : 1);
  });
}

function mergeSimple(a, b) {
  return { id: a.id, created: Math.min(a.created || 0, b.created || 0), fields: mergeFields(a.fields, b.fields) };
}

function mergeSlot(a, b) {
  return {
    id: a.id,
    created: Math.min(a.created || 0, b.created || 0),
    fields: mergeFields(a.fields, b.fields),
    hearts: mergeList(a.hearts || [], b.hearts || [], mergeSimple),
    tags: mergeList(a.tags || [], b.tags || [], mergeSimple)
  };
}

function mergeDay(a, b) {
  return {
    id: a.id,
    created: Math.min(a.created || 0, b.created || 0),
    fields: mergeFields(a.fields, b.fields),
    chips: mergeList(a.chips, b.chips, mergeSimple),
    slots: mergeList(a.slots, b.slots, mergeSlot)
  };
}

function mergePlans(mine, theirs) {
  if (!theirs || !Array.isArray(theirs.days)) return mine;
  return {
    fields: mergeFields(mine.fields, theirs.fields),
    days: mergeList(mine.days, theirs.days.map(upgradeDay), mergeDay),
    docs: mergeList(mine.docs || [], theirs.docs || [], mergeSimple)
  };
}

/* Plans saved before days held their own card lists. */
function foldTone(day) {
  if (!day || !day.fields) return day;
  var tone = day.fields.tone && String(day.fields.tone.v || '').trim();
  if (!tone) return day;
  var highlights = day.fields.highlights && String(day.fields.highlights.v || '').trim();
  if (!highlights) {
    day.fields.highlights = day.fields.tone;
  } else if (highlights.indexOf(tone) === -1) {
    day.fields.highlights = {
      v: highlights + '\n' + tone,
      t: Math.max(day.fields.highlights.t || 0, day.fields.tone.t || 0)
    };
  }
  day.fields.tone = { v: '', t: Date.now() };
  return day;
}

function upgradeDay(day) {
  if (!day || !day.fields) return day;
  if (day.chips && day.slots) {
    var leftover = (day.chips || []).filter(function (chip) {
      return !(chip && chip.fields && chip.fields.removed && chip.fields.removed.v === '1');
    });
    if (leftover.length && leftover.every(function (chip) {
      return !(chip.fields && chip.fields.text && String(chip.fields.text.v || '').trim());
    })) {
      leftover.forEach(function (chip) {
        chip.fields = chip.fields || {};
        chip.fields.removed = { v: '1', t: Date.now() };
      });
    }
    (day.slots || []).forEach(function (slot) {
      if (!slot.hearts) slot.hearts = [];
      if (!slot.tags) slot.tags = [];
    });
    var leftover = (day.slots || []).filter(function (slot) {
      return !(slot.fields && slot.fields.removed && slot.fields.removed.v === '1');
    });
    if (leftover.length === 1 && isBlankActivity(leftover[0])) {
      leftover[0].fields = leftover[0].fields || {};
      leftover[0].fields.removed = { v: '1', t: Date.now() };
    }
    return foldTone(day);
  }
  var out = { id: day.id, created: day.created, fields: {}, chips: day.chips || [], slots: day.slots || [] };
  ['name', 'highlights', 'tone', 'tip', 'removed'].forEach(function (k) {
    if (day.fields[k]) out.fields[k] = day.fields[k];
  });
  for (var c = 0; c < 3; c++) {
    var chip = day.fields['chip' + c];
    if (chip && chip.v) out.chips.push({ id: day.id + '-c' + c, created: (day.created || 0) + c, fields: { text: chip } });
  }
  for (var i = 0; i < 8; i++) {
    var time = day.fields['s' + i + 'time'];
    var title = day.fields['s' + i + 'title'];
    var detail = day.fields['s' + i + 'detail'];
    if (!(time || title || detail)) continue;
    if (!((time && time.v) || (title && title.v) || (detail && detail.v))) continue;
    out.slots.push({
      id: day.id + '-s' + i,
      created: (day.created || 0) + i,
      fields: { time: time || cell(''), title: title || cell(''), detail: detail || cell('') },
      hearts: [],
      tags: []
    });
  }
  return foldTone(out);
}

/* ─── Editing ───────────────────────────────────────────── */

function fieldText(el) {
  return (el.textContent || '').replace(/\u00a0/g, ' ').trim();
}

function paint(el, value) {
  if (!el || el === document.activeElement) return;
  if (fieldText(el) === (value || '')) return;
  el.textContent = value || '';
}

function bindEditable(el, read, write) {
  el.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && el.getAttribute('data-multiline') !== '1') {
      e.preventDefault();
      el.blur();
    }
  });
  el.addEventListener('paste', function (e) {
    e.preventDefault();
    var text = (e.clipboardData || window.clipboardData).getData('text/plain');
    document.execCommand('insertText', false, text);
  });
  el.addEventListener('input', function () {
    write(fieldText(el));
    onEdit();
  });
  if (read) paint(el, read());
}

/* ─── Rendering ─────────────────────────────────────────── */

function showScreen(id) {
  var next = document.getElementById('screen-' + id) || document.getElementById(id);
  if (!next) next = document.getElementById('screen-home');
  document.querySelectorAll('.screen').forEach(function (el) {
    var on = el === next;
    el.classList.toggle('active', on);
    el.toggleAttribute('hidden', !on);
  });
  window.scrollTo(0, 0);
  document.getElementById('nav-home').classList.toggle('active', next.id === 'screen-home');
  document.getElementById('nav-hearts').classList.toggle('active', next.id === 'screen-hearts');
  document.getElementById('nav-docs').classList.toggle('active', next.id === 'screen-docs');
  if (next.id === 'screen-hearts') renderHearts();
  if (next.id === 'screen-docs') renderDocs();
  rememberScreen(next.id);
}

/* The open page lives in the link, so a refresh comes back to it. */
function rememberScreen(screenId) {
  var url = new URL(location.href);
  url.hash = screenId === 'screen-home' ? '' : '#' + screenId.replace(/^screen-/, '');
  history.replaceState(null, '', url);
}

function restoreScreen() {
  var id = location.hash.replace(/^#/, '');
  if (!id) return;
  var target = document.getElementById('screen-' + id);
  if (!target) return; // the day may still be on its way from the other browser
  if (target.classList.contains('active')) return;
  showScreen(id);
}

function fieldEls(root, attr) {
  return root.hasAttribute(attr) ? [root] : Array.prototype.slice.call(root.querySelectorAll('[' + attr + ']'));
}

function wireFields(root, owner, attr, mirror) {
  fieldEls(root, attr).forEach(function (el) {
    if (!el.isContentEditable) return;
    var key = el.getAttribute(attr);
    bindEditable(el, function () { return get(owner, key); }, function (value) {
      set(owner, key, value);
      if (mirror) mirror(key);
    });
  });
}

function paintOwner(root, owner, attr) {
  if (!root) return;
  fieldEls(root, attr).forEach(function (el) {
    paint(el, get(owner, el.getAttribute(attr)));
  });
}

/* Reconcile a list of items against its DOM container, reusing
   nodes so a remote update never yanks the caret out of a field. */
function syncList(container, items, build, paintItem, idAttr, before) {
  var seen = {};
  items.forEach(function (item, i) {
    seen[item.id] = 1;
    var el = container.querySelector('[' + idAttr + '="' + item.id + '"]');
    if (!el) {
      el = build(item);
      before ? container.insertBefore(el, before) : container.appendChild(el);
    }
    var at = container.children[i];
    if (at !== el && !el.contains(document.activeElement)) container.insertBefore(el, at);
    paintItem(el, item);
  });
  container.querySelectorAll('[' + idAttr + ']').forEach(function (el) {
    if (!seen[el.getAttribute(idAttr)]) el.remove();
  });
}

function paintSlotImage(el, slot) {

function paintSlotHearts(el, slot) {

function orderedLiveSlots(day) {
  return orderedSlots(live(day.slots));
}

/* Dragging by hand, with the arrow keys as the keyboard equivalent. */
function wireSlotDrag(el, day, slot) {
  var handle = el.querySelector('.drag-handle');

  handle.onkeydown = function (event) {
    if (event.key !== 'ArrowUp' && event.key !== 'ArrowDown') return;
    event.preventDefault();
    moveSlot(day, slot, event.key === 'ArrowUp' ? -1 : 1);
    var again = document.querySelector('[data-slot="' + slot.id + '"] .drag-handle');
    if (again) again.focus();
  };

  handle.addEventListener('pointerdown', function (event) {
    if (event.button) return;
    event.preventDefault();
    var timeline = el.parentNode;
    el.classList.add('dragging');
    timeline.classList.add('is-dragging');

    function over(moveEvent) {
      // Cards are tall, so keep the page moving while the finger sits near an edge.
      var edge = 90;
      if (moveEvent.clientY < edge) window.scrollBy(0, -12);
      else if (moveEvent.clientY > window.innerHeight - edge) window.scrollBy(0, 12);

      var under = document.elementFromPoint(moveEvent.clientX, moveEvent.clientY);
      var target = under && under.closest ? under.closest('.slot') : null;
      if (!target || target === el || target.parentNode !== timeline) return;
      var box = target.getBoundingClientRect();
      var after = moveEvent.clientY > box.top + box.height / 2;
      timeline.insertBefore(el, after ? target.nextSibling : target);
    }

    function drop() {
      document.removeEventListener('pointermove', over);
      document.removeEventListener('pointerup', drop);
      document.removeEventListener('pointercancel', drop);
      el.classList.remove('dragging');
      timeline.classList.remove('is-dragging');
      commitSlotOrder(day, timeline);
    }

    document.addEventListener('pointermove', over);
    document.addEventListener('pointerup', drop);
    document.addEventListener('pointercancel', drop);
  });
}

function commitSlotOrder(day, timeline) {
  var ids = Array.prototype.map.call(timeline.querySelectorAll('[data-slot]'), function (node) {
    return node.getAttribute('data-slot');
  });
  var slots = orderedLiveSlots(day);
  if (ids.join('|') === slots.map(function (slot) { return slot.id; }).join('|')) return;
  var values = orderValues(ids);
  slots.forEach(function (slot) {
    if (values[slot.id] && get(slot, 'order') !== values[slot.id]) set(slot, 'order', values[slot.id]);
  });
  renderDay(day);
  onEdit();
}

function openFullDayImport(screen) {
  var panel = screen.querySelector('.full-day-import');
  panel.hidden = false;
  var textarea = panel.querySelector('.full-day-text');
  setTimeout(function () { textarea.focus(); }, 0);
}

function closeFullDayImport(screen) {
  screen.querySelector('.full-day-import').hidden = true;
  screen.querySelector('.full-day-text').value = '';
}

function wireFullDayDrop(screen) {
  var textarea = screen.querySelector('.full-day-text');
  textarea.addEventListener('dragover', function (event) {
    event.preventDefault();
    textarea.classList.add('is-drop-target');
  });
  textarea.addEventListener('dragleave', function () {
    textarea.classList.remove('is-drop-target');
  });
  textarea.addEventListener('drop', function (event) {
    event.preventDefault();
    textarea.classList.remove('is-drop-target');
    var file = event.dataTransfer.files && event.dataTransfer.files[0];
    if (file && typeof file.text === 'function') {
      file.text().then(function (text) { textarea.value = text; });
      return;
    }
    var text = event.dataTransfer.getData('text/plain');
    if (text) textarea.value = text;
  });
}

function importFullDay(day, screen) {
  var textarea = screen.querySelector('.full-day-text');
  var activities = parseFullDay(textarea.value);
  if (!activities.length) {
    toast('Paste at least one activity first.');
    textarea.focus();
    return;
  }

  var existing = orderedLiveSlots(day);
  if (existing.length === 1 && isBlankActivity(existing[0])) {
    set(existing[0], 'removed', '1');
    existing = [];
  }

  activities.forEach(function (activity, index) {
    var slot = newSlot();
    set(slot, 'time', activity.time);
    set(slot, 'title', activity.title);
    set(slot, 'detail', activity.detail);
    set(slot, 'order', String((existing.length + index + 1) * 10));
    day.slots.push(slot);
  });
  closeFullDayImport(screen);
  renderDay(day);
  onEdit();
  toast(activities.length + (activities.length === 1 ? ' card created.' : ' cards created.'));
}

function moveSlot(day, slot, direction) {
  var slots = orderedLiveSlots(day);
  var ids = slots.map(function (item) { return item.id; });
  var moved = moveSlotIds(ids, slot.id, direction);
  if (moved.join('|') === ids.join('|')) return;
  moved.forEach(function (id, index) {
    var item = slots.find(function (candidate) { return candidate.id === id; });
    var value = String((index + 1) * 10);
    if (get(item, 'order') !== value) set(item, 'order', value);
  });
  renderDay(day);
  onEdit();
}

function loadUser() {
  try {
    var saved = JSON.parse(localStorage.getItem(LS_USER) || 'null');
    if (saved && saved.id && saved.name) return saved;
  } catch (e) {}
  return null;
}

function persistUser(user) {
  me = user;
  try { localStorage.setItem(LS_USER, JSON.stringify(user)); } catch (e) {}
  return user;
}

function askNameIfNeeded() {
  me = me || loadUser();
  var gate = document.getElementById('name-gate');
  if (!needsName(me, !!planKey)) {
    gate.hidden = true;
    return false;
  }
  gate.hidden = false;
  var input = document.getElementById('name-input');
  input.value = (me && me.name) || '';
  setTimeout(function () { input.focus(); }, 50);
  return true;
}

function submitName(event) {
  if (event) event.preventDefault();
  var user = saveUser(me || loadUser(), document.getElementById('name-input').value, function () { return uid('u'); });
  if (!user) {
    document.getElementById('name-input').focus();
    return;
  }
  persistUser(user);
  document.getElementById('name-gate').hidden = true;
}

function ensureUser() {
  me = me || loadUser();
  if (me && me.name) return me;
  askNameIfNeeded();
  return me && me.name ? me : null;
}

function toggleSlotHeart(day, slot) {
  if (!ensureUser()) return;
  toggleHeart(slot, me);
  renderDay(day);
  renderHearts();
  onEdit();
}

function renderHearts() {
  var filters = document.getElementById('heart-filters');
  var list = document.getElementById('heart-list');
  if (!filters || !list) return;
  var users = heartUsers(plan);
  var options = [{ id: '', name: 'All' }].concat(users);
  if (heartFilter && !users.some(function (user) { return user.id === heartFilter; })) heartFilter = '';
  filters.innerHTML = '';
  options.forEach(function (user) {
    var button = document.createElement('button');
    button.type = 'button';
    button.className = 'heart-filter' + (heartFilter === user.id ? ' is-on' : '');
    button.textContent = user.name;
    button.onclick = function () {
      heartFilter = user.id;
      renderHearts();
    };
    filters.appendChild(button);
  });
  var items = heartList(plan, heartFilter || undefined);
  list.innerHTML = '';
  if (!items.length) {
    var empty = document.createElement('p');
    empty.className = 'heart-empty';
    empty.textContent = 'No favorites yet. Open a day and tap ♡ on an activity.';
    list.appendChild(empty);
    return;
  }
  items.forEach(function (item) {
    var card = document.createElement('button');
    card.type = 'button';
    card.className = 'card heart-item';
    card.innerHTML =
      '<h3></h3>' +
      '<p class="muted"></p>';
    card.querySelector('h3').textContent = item.title;
    card.querySelector('.muted').textContent =
      (item.time ? item.time + ' · ' : '') + item.dayName + ' · ' + item.hearts.map(function (heart) { return heart.name; }).join(', ');
    card.onclick = function () { showScreen('day-' + item.dayId); };
    list.appendChild(card);
  });
}

function buildDoc(doc) {
  var el = document.createElement('div');
  el.className = 'card doc-card';
  el.setAttribute('data-doc', doc.id);
  var preview = docKind(doc) === 'image'
    ? '<img class="doc-preview" alt="">'
    : '<a class="doc-file" href="#" download></a>';
  el.innerHTML =
    trashButton('Remove this document') +
    preview +
    '<h3 contenteditable="true" data-dkey="name" data-ph="File name"></h3>' +
    '<p contenteditable="true" data-dkey="description" data-multiline="1" data-ph="What this is, and when you need it."></p>';
  wireFields(el, doc, 'data-dkey');
  el.querySelector('.trash-btn').onclick = function () {
    if (!confirmRemove('doc')) return;
    set(doc, 'removed', '1');
    renderDocs();
    onEdit();
  };
  return el;
}

function paintDoc(el, doc) {
  paintOwner(el, doc, 'data-dkey');
  var data = get(doc, 'data');
  var name = get(doc, 'name') || 'File';
  if (docKind(doc) === 'image') {
    var image = el.querySelector('.doc-preview');
    if (image) {
      image.src = data;
      image.alt = name;
    }
    return;
  }
  var link = el.querySelector('.doc-file');
  if (!link) return;
  link.href = data || '#';
  link.download = name;
  link.textContent = name;
}

function renderDocs() {
  var list = document.getElementById('docs-list');
  if (!list) return;
  if (!plan.docs) plan.docs = [];
  var items = live(plan.docs);
  var empty = list.querySelector('.doc-empty');
  if (!items.length) {
    list.querySelectorAll('[data-doc]').forEach(function (el) { el.remove(); });
    if (!empty) {
      empty = document.createElement('p');
      empty.className = 'doc-empty';
      empty.textContent = 'No documents yet. Add a photo or a file you both need.';
      list.appendChild(empty);
    }
    return;
  }
  if (empty) empty.remove();
  syncList(list, items, function (doc) { return buildDoc(doc); }, paintDoc, 'data-doc');
}

function addDocFile(file, kindHint) {
  if (!file) return;
  var asImage = kindHint === 'image' || (file.type && file.type.indexOf('image/') === 0);
  if (!asImage && tooLarge(file.size)) {
    toast('That file is too large to share here (max 1.5 MB).');
    return;
  }
  var doc = newDoc(function () { return uid('f'); });
  set(doc, 'name', file.name || (asImage ? 'Photo' : 'File'));
  set(doc, 'kind', asImage ? 'image' : 'file');
  set(doc, 'mime', file.type || '');

  function finish(dataUrl) {
    if (tooLarge(String(dataUrl || '').length)) {
      toast('That file is too large to share here (max 1.5 MB).');
      return;
    }
    set(doc, 'data', dataUrl);
    if (!plan.docs) plan.docs = [];
    plan.docs.push(doc);
    renderDocs();
    onEdit();
  }

  if (asImage) {
    processImageFile(file, finish);
    return;
  }
  var reader = new FileReader();
  reader.onerror = function () { toast('That file could not be read.'); };
  reader.onload = function () { finish(reader.result); };
  reader.readAsDataURL(file);
}

var lightboxShots = [];
var lightboxAt = 0;

function openLightbox(shots, index) {
  lightboxShots = shots;
  lightboxAt = index;
  document.getElementById('lightbox').classList.add('open');
  paintLightbox();
}

function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  document.getElementById('lightbox-image').src = '';
}

function stepLightbox(by) {
  if (lightboxShots.length < 2) return;
  lightboxAt = (lightboxAt + by + lightboxShots.length) % lightboxShots.length;
  paintLightbox();
}

function paintLightbox() {
  var shot = lightboxShots[lightboxAt];
  if (!shot) return closeLightbox();
  var image = document.getElementById('lightbox-image');
  image.src = shot.src;
  image.alt = shot.alt;
  var many = lightboxShots.length > 1;
  document.querySelector('.lightbox-prev').hidden = !many;
  document.querySelector('.lightbox-next').hidden = !many;
}

function wireLightbox() {
  var box = document.getElementById('lightbox');
  box.onclick = function (event) { if (event.target === box) closeLightbox(); };
  box.querySelector('.lightbox-close').onclick = closeLightbox;
  box.querySelector('.lightbox-prev').onclick = function () { stepLightbox(-1); };
  box.querySelector('.lightbox-next').onclick = function () { stepLightbox(1); };
  document.addEventListener('keydown', function (event) {
    if (!box.classList.contains('open')) return;
    if (event.key === 'Escape') closeLightbox();
    if (event.key === 'ArrowLeft') stepLightbox(-1);
    if (event.key === 'ArrowRight') stepLightbox(1);
  });
}

function paintGallery(screen, day) {
  var gallery = screen.querySelector('.day-gallery');
  gallery.innerHTML = '';
  var shots = [];
  orderedLiveSlots(day).forEach(function (slot) {
    var dataUrl = get(slot, 'image');
    if (!dataUrl) return;
    shots.push({ src: dataUrl, alt: get(slot, 'title') || 'Day activity' });
  });
  shots.forEach(function (shot, index) {
    var thumb = document.createElement('button');
    thumb.type = 'button';
    thumb.className = 'gallery-thumb';
    thumb.title = shot.alt;
    thumb.setAttribute('aria-label', 'Open photo: ' + shot.alt);
    thumb.onclick = function () { openLightbox(shots, index); };
    var image = document.createElement('img');
    image.src = shot.src;
    image.alt = shot.alt;
    thumb.appendChild(image);
    gallery.appendChild(thumb);
  });
}

function renderDay(day) {
  paintDayCard(day);
  var screen = document.getElementById('screen-day-' + day.id);
  if (!screen) return;
  var dir = dayDirection(day);
  paintOwner(screen, day, 'data-key');
  syncList(
    screen.querySelector('.day-tags'),
    live(day.chips),
    function (chip) { return buildChip(day, chip); },
    function (el, chip) { paintOwner(el, chip, 'data-ckey'); },
    'data-chip',
    screen.querySelector('.chip-add')
  );
  syncList(
    screen.querySelector('.timeline'),
    orderedLiveSlots(day),
    function (slot) { return buildSlot(day, slot); },
    function (el, slot) {
      el.setAttribute('dir', dir);
      paintOwner(el, slot, 'data-skey');
      syncList(
        el.querySelector('.slot-tags'),
        live(slot.tags),
        function (tag) { return buildSlotTag(day, slot, tag); },
        function (tagEl, tag) { paintOwner(tagEl, tag, 'data-tkey'); },
        'data-slot-tag',
        el.querySelector('.slot-tag-add')
      );
      paintSlotImage(el, slot);
      paintSlotHearts(el, slot);
    },
    'data-slot'
  );
  paintGallery(screen, day);
}

function render() {
  var cards = document.getElementById('day-cards');
  var container = document.querySelector('.container');
  var days = live(plan.days);
  var shown = {};

  days.forEach(function (day, i) {
    shown[day.id] = 1;
    var card = cards.querySelector('[data-day="' + day.id + '"]');
    if (!card) {
      card = buildCard(day);
      cards.appendChild(card);
    }
    var screen = document.getElementById('screen-day-' + day.id);
    if (!screen) {
      screen = buildScreen(day);
      container.appendChild(screen);
    }
    if (cards.children[i] !== card && !card.contains(document.activeElement)) cards.insertBefore(card, cards.children[i]);
    renderDay(day);
  });

  cards.querySelectorAll('[data-day]').forEach(function (el) {
    if (!shown[el.getAttribute('data-day')]) el.remove();
  });
  document.querySelectorAll('.screen[data-day]').forEach(function (el) {
    if (!shown[el.getAttribute('data-day')]) {
      if (el.classList.contains('active')) showScreen('home');
      el.remove();
    }
  });
  if (!document.querySelector('.screen.active')) showScreen('home');
  if (document.getElementById('screen-hearts').classList.contains('active')) renderHearts();
  if (document.getElementById('screen-docs').classList.contains('active')) renderDocs();
}

function addDay() {
  var days = live(plan.days);
  var last = days[days.length - 1];
  if (last && isBlankDay(last)) {
    showScreen('day-' + last.id);
    return;
  }
  plan.days.push(newDay());
  render();
  onEdit();
  var added = live(plan.days);
  showScreen('day-' + added[added.length - 1].id);
}

function confirmRemove(label) {
  return confirm('Are you sure you want to remove this ' + label + '?');
}

function removeDay(day) {
  if (!confirmRemove('day')) return;
  set(day, 'removed', '1');
  render();
  onEdit();
}

function addSlot(day) {
  var slot = newSlot();
  set(slot, 'order', String((orderedLiveSlots(day).length + 1) * 10));
  day.slots.push(slot);
  renderDay(day);
  onEdit();
  var title = document.querySelector('#screen-day-' + day.id + ' [data-slot="' + slot.id + '"] [data-skey="title"]');
  if (title) title.focus();
}

function addChip(day) {
  day.chips.push(newChip());
  renderDay(day);
  onEdit();
  var added = document.querySelector('#screen-day-' + day.id + ' .day-tags [data-chip]:last-of-type .chip');
  if (added) added.focus();
}

function addSlotTag(day, slot) {
  if (!slot.tags) slot.tags = [];
  var tag = newChip();
  slot.tags.push(tag);
  renderDay(day);
  onEdit();
  var added = document.querySelector(
    '#screen-day-' + day.id + ' [data-slot="' + slot.id + '"] [data-slot-tag="' + tag.id + '"] .chip'
  );
  if (added) added.focus();
}

function removeItem(day, item) {
  set(item, 'removed', '1');
  renderDay(day);
  onEdit();
}

/* Shared plans store images as compact data URLs. Resizing here keeps
   localStorage and live sync usable even when a phone photo is large. */
function processImageFile(file, done) {
  if (!file.type || file.type.indexOf('image/') !== 0) {
    toast('Please choose an image file.');
    return;
  }
  var reader = new FileReader();
  reader.onerror = function () { toast('That image could not be read.'); };
  reader.onload = function () {
    var source = new Image();
    source.onerror = function () { toast('That image could not be opened.'); };
    source.onload = function () {
      var max = 1000;
      var scale = Math.min(1, max / Math.max(source.width, source.height));
      var canvas = document.createElement('canvas');
      canvas.width = Math.max(1, Math.round(source.width * scale));
      canvas.height = Math.max(1, Math.round(source.height * scale));
      var context = canvas.getContext('2d');
      context.fillStyle = '#ffffff';
      context.fillRect(0, 0, canvas.width, canvas.height);
      context.drawImage(source, 0, 0, canvas.width, canvas.height);
      done(canvas.toDataURL('image/jpeg', 0.76));
    };
    source.src = reader.result;
  };
  reader.readAsDataURL(file);
}

/* ─── Sync ──────────────────────────────────────────────── */

/* The header shows company, not plumbing: who else has the page open.
   It only falls back to a connection word when something is wrong. */
function status(state, text) {
  connection = { state: state || '', text: text || '' };
  paintPresence();
}

function paintPresence() {
  var pill = document.getElementById('sync-pill');
  if (!pill) return;
  pill.hidden = !planKey;
  var broken = connection.state === 'offline';
  pill.className = 'sync-pill' + (broken ? ' is-offline' : (activePeers(peers, Date.now(), PRESENCE_TTL).length ? ' is-together' : ''));
  document.getElementById('sync-text').textContent = broken
    ? connection.text
    : presenceLabel(peers, Date.now(), PRESENCE_TTL);
}

function toast(msg) {
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(function () { el.classList.remove('show'); }, 3600);
}

function saveLocal() {
  try { localStorage.setItem(LS_PLAN, JSON.stringify(plan)); } catch (e) {
    toast('This plan is getting too large for this phone. Try a smaller file.');
  }
}

function onEdit() {
  dirty = true;
  saveLocal();
  if (planKey) status('saving', 'Saving…');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(sync, 400);
}

function shareUrl() {
  var u = new URL(location.href);
  if (planKey) u.searchParams.set('p', planKey);
  return u.toString();
}

function setPlanKey(key) {
  planKey = key;
  try { localStorage.setItem(LS_ID, key); } catch (e) {}
  var u = new URL(location.href);
  u.searchParams.set('p', key);
  history.replaceState(null, '', u);
  listen();
}

async function readRemote() {
  var res = await fetch(STORE + planKey + '?t=' + Date.now(), { cache: 'no-store' });
  if (!res.ok) throw new Error('read failed');
  var text = await res.text();
  if (!text) return null; // nothing saved under this link yet
  try { return JSON.parse(text); } catch (e) { return null; }
}

async function writeRemote() {
  var res = await fetch(STORE + planKey, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain' },
    body: JSON.stringify(plan)
  });
  if (!res.ok) throw new Error('write failed');
  // Nudge the other browser so it reloads immediately instead of waiting for the next poll.
  signal('edit');
}

/* One tiny message carries both "I'm here" and "I just saved". */
function signal(kind, keepalive) {
  if (!planKey) return;
  var body = JSON.stringify({ c: CLIENT, n: (me && me.name) || '', k: kind });
  fetch(SIGNAL + topic() + '?cache=no', { method: 'POST', body: body, keepalive: !!keepalive }).catch(function () {});
}

function sendPing() {
  signal('ping');
}

/* One pass: read what the other person wrote, merge it into ours,
   and write back when we have local edits. */
async function sync() {
  if (!planKey || syncing) return;
  syncing = true;
  try {
    var merged = mergePlans(plan, await readRemote());
    if (JSON.stringify(merged) !== JSON.stringify(plan)) {
      plan = merged;
      paintCover();
      render();
      saveLocal();
    }
    if (dirty) {
      dirty = false;
      await writeRemote();
    }
    status('', 'Live');
  } catch (e) {
    dirty = true;
    status('offline', 'Offline');
  } finally {
    syncing = false;
  }
}

function topic() {
  return 'lbplan-' + planKey;
}

/* Server-sent events: the other person's save arrives as a push,
   so their words land here in about a second. */
function listen() {
  if (!planKey || stream) return;
  stream = new EventSource(SIGNAL + topic() + '/sse');
  stream.onopen = function () {
    status('', '');
    sendPing();
  };
  stream.onmessage = function (e) {
    var msg = null;
    try { msg = JSON.parse(e.data); } catch (err) { return; }
    if (!msg || msg.event !== 'message') return;

    var note = null;
    try { note = JSON.parse(msg.message); } catch (err) { note = null; }
    if (!note || !note.c || note.c === CLIENT) return;

    if (note.k === 'bye') dropPeer(peers, note.c);
    else notePeer(peers, { client: note.c, name: note.n }, Date.now());
    paintPresence();

    if (note.k === 'edit') sync();
    else if (note.k === 'hello') sendPing();
  };
  stream.onerror = function () { status('offline', 'Reconnecting…'); };
}

function startPresence() {
  signal('hello');
  setInterval(sendPing, PRESENCE_MS);
  setInterval(paintPresence, PRESENCE_MS);
  window.addEventListener('pagehide', function () { signal('bye', true); });
}

async function copyLink() {
  var url = shareUrl();
  try {
    await navigator.clipboard.writeText(url);
    toast('Link copied. Anyone with it can edit this plan with you.');
    return;
  } catch (e) {}
  // Older phone browsers refuse the clipboard API outside a secure page.
  var field = document.createElement('textarea');
  field.value = url;
  field.setAttribute('readonly', '');
  field.style.position = 'fixed';
  field.style.opacity = '0';
  document.body.appendChild(field);
  field.select();
  var copied = false;
  try { copied = document.execCommand('copy'); } catch (e) {}
  document.body.removeChild(field);
  toast(copied ? 'Link copied. Anyone with it can edit this plan with you.' : url);
}

async function init() {
  COVER_FIELDS.forEach(function (key) {
    var el = document.querySelector('[data-field="' + key + '"]');
    bindEditable(el, function () { return get(plan, key); }, function (value) { set(plan, key, value); });
  });

  try {
    var saved = JSON.parse(localStorage.getItem(LS_PLAN) || 'null');
    if (saved && Array.isArray(saved.days) && saved.days.length && saved.days[0].fields) {
      saved.days = saved.days.map(upgradeDay);
      plan = saved;
      if (!Array.isArray(plan.docs)) plan.docs = [];
    }
  } catch (e) {}

  paintCover();
  render();
  restoreScreen();

  wireLightbox();

  document.getElementById('docs-image-input').onchange = function (event) {
    var file = event.target.files && event.target.files[0];
    event.target.value = '';
    addDocFile(file, 'image');
  };
  document.getElementById('docs-file-input').onchange = function (event) {
    var file = event.target.files && event.target.files[0];
    event.target.value = '';
    addDocFile(file, 'file');
  };

  // The plan is live from the first visit, so there is nothing to switch on.
  var params = new URLSearchParams(location.search);
  var key = params.get('p') || localStorage.getItem(LS_ID) ||
    ('lb' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8));
  status('saving', 'Connecting…');
  setPlanKey(key);
  dirty = true;
  await sync();
  restoreScreen();
  askNameIfNeeded();
  startPresence();

  setInterval(sync, POLL_MS);
  window.addEventListener('focus', sync);
}

init();
</script>
