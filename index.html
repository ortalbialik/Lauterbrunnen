<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Lauterbrunnen — Travel Plan</title>
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --red: #ef4444;
  --red-light: #fee2e2;
  --red-dark: #991b1b;
  --orange: #f97316;
  --orange-light: #fef3c7;
  --orange-dark: #92400e;
  --green: #22c55e;
  --green-light: #dcfce7;
  --green-dark: #166534;
  --blue: #3b82f6;
  --blue-light: #dbeafe;
  --blue-dark: #1e40af;
  --purple: #8b5cf6;
  --purple-light: #ede9fe;
  --dark: #0f172a;
  --text: #1e293b;
  --muted: #94a3b8;
  --border: #e2e8f0;
  --light-bg: #f8fafc;
  --card-bg: #ffffff;
  --radius: 12px;
  --photo-ratio: 4 / 3;
  --thumb-size: 72px;
  --cover-height: 150px;
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
  --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
  --shadow-lg: 0 8px 24px rgba(0,0,0,0.12);
  --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
}

html { scroll-behavior: smooth; }

body {
  font-family: var(--font);
  background: var(--light-bg);
  color: var(--text);
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  align-items: center;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

.container {
  width: 100%;
  max-width: 480px;
  padding: 0 20px 32px;
  flex: 1;
  display: flex;
  flex-direction: column;
}

.app-header {
  width: 100%;
  background: var(--dark);
  position: sticky;
  top: 0;
  z-index: 100;
}
.app-header .accent-bar {
  height: 3px;
  background: linear-gradient(90deg, var(--red), var(--orange), var(--blue), var(--purple));
}
.app-header .header-content {
  max-width: 480px;
  margin: 0 auto;
  padding: 14px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.nav-pill {
  background: rgba(255,255,255,0.1);
  color: rgba(255,255,255,0.7);
  border: none;
  padding: 6px 14px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s;
  font-family: var(--font);
  white-space: nowrap;
  flex: 0 0 auto;
}
.nav-pill.active { background: rgba(255,255,255,0.2); color: #fff; }
.nav-links {
  display: flex;
  gap: 6px;
  align-items: center;
  min-width: 0;
  overflow-x: auto;
  scrollbar-width: none;
}
.nav-links::-webkit-scrollbar { display: none; }

.status-info {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  margin-left: auto;
  padding-left: 10px;
  flex: 0 0 auto;
}
.plan-code {
  border: 0;
  background: transparent;
  color: rgba(255,255,255,0.82);
  font: 600 11px/1.2 var(--font);
  letter-spacing: 0.04em;
  cursor: pointer;
  padding: 0;
  white-space: nowrap;
}
.plan-code:hover, .plan-code:focus-visible { color: #fff; text-decoration: underline; }
.plan-code[hidden] { display: none; }
.sync-pill {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 0;
  border-radius: 0;
  background: transparent;
  color: rgba(255,255,255,0.55);
  font-size: 12px;
  font-weight: 500;
  margin-left: 0;
  padding-left: 0;
  white-space: nowrap;
  flex: 0 0 auto;
  pointer-events: none;
}
.sync-pill[hidden] { display: none; }
.sync-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--green);
}
.sync-dot { background: rgba(255,255,255,0.35); }
.sync-pill.is-together { color: rgba(255,255,255,0.85); }
.sync-pill.is-together .sync-dot { background: var(--green); }
.sync-pill.is-offline .sync-dot { background: var(--red); }

[contenteditable] {
  outline: none;
  cursor: text;
  min-width: 1em;
}
[contenteditable]:focus {
  outline: none;
  box-shadow: none;
}
[contenteditable]:empty::before {
  content: attr(data-ph);
  color: var(--muted);
  font-style: italic;
  pointer-events: none;
}
[data-display]:empty::before {
  content: attr(data-ph);
  color: var(--muted);
  font-style: italic;
}
.cover-overlay [contenteditable]:empty::before {
  color: rgba(255,255,255,0.55);
}
.hero-day h2[contenteditable] {
  color: var(--dark);
  font-style: normal;
}
.subtitle[contenteditable]:not(:empty) { color: var(--text); font-style: normal; }
.tip[contenteditable]:not(:empty) { color: var(--blue-dark); font-style: normal; }
.chip[contenteditable] { min-width: 0; min-height: 1.4em; width: max-content; }
.chip[contenteditable]:empty { min-width: 2.2em; }

.toast {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--dark);
  color: #fff;
  font-size: 13px;
  font-weight: 500;
  padding: 10px 16px;
  border-radius: 999px;
  box-shadow: var(--shadow-lg);
  z-index: 200;
  display: none;
  max-width: 90vw;
  text-align: center;
}
.toast.show { display: block; }

.name-gate {
  position: fixed;
  inset: 0;
  z-index: 300;
  background: rgba(15, 23, 42, 0.55);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.name-gate[hidden], .plan-gate[hidden] { display: none; }
.plan-gate {
  position: fixed;
  inset: 0;
  z-index: 310;
  background: rgba(15, 23, 42, 0.62);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.name-card {
  width: min(360px, 100%);
  background: #fff;
  border-radius: var(--radius);
  box-shadow: var(--shadow-lg);
  padding: 22px 20px 18px;
}
.plan-card { width: min(390px, 100%); }
.plan-card .plan-current {
  color: var(--text);
  font-weight: 700;
  margin-bottom: 12px;
}
.plan-card .plan-divider {
  color: var(--muted);
  font-size: 12px;
  text-align: center;
  margin: 12px 0;
}
.plan-known { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.plan-known[hidden] { display: none; }
.plan-known button {
  border: 1px solid var(--border);
  background: var(--light-bg);
  color: var(--text);
  border-radius: 999px;
  padding: 6px 12px;
  font: 600 12px/1.2 var(--font);
  cursor: pointer;
}
.plan-card .btn { width: 100%; }
.plan-card .btn + .btn { margin-top: 8px; }
.name-card h2 { margin-bottom: 6px; }
.name-card p { color: var(--muted); font-size: 14px; margin-bottom: 16px; }
.name-card input {
  width: 100%;
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 12px 14px;
  font-size: 16px;
  font-family: var(--font);
  margin-bottom: 12px;
  outline: none;
  color: var(--text);
}
.name-card .btn-primary { margin-bottom: 0; }

.screen { display: none; flex-direction: column; flex: 1; }
.screen.active { display: flex; }
.screen.active:not(#screen-home) { padding-top: 8px; }

.fade-in {
  opacity: 0;
  transform: translateY(16px);
  animation: fadeUp 0.5s ease forwards;
}
@keyframes fadeUp {
  to { opacity: 1; transform: translateY(0); }
}

h1 {
  font-size: 32px;
  font-weight: 800;
  letter-spacing: -0.5px;
  color: var(--dark);
  line-height: 1.2;
}
h2 {
  font-size: 22px;
  font-weight: 700;
  letter-spacing: -0.3px;
  color: var(--dark);
  margin-bottom: 8px;
}
h3 {
  font-size: 16px;
  font-weight: 700;
  color: var(--dark);
  margin-bottom: 6px;
}
.overline {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  color: var(--muted);
  font-weight: 600;
  margin-bottom: 8px;
}
.subtitle {
  color: var(--muted);
  font-size: 15px;
  line-height: 1.6;
}

/* Placeholder text — replace the content, then this styling stops applying */
.ph { color: var(--muted); font-weight: 400; font-style: italic; }

/* ─── Cover ─── */
.cover {
  position: relative;
  width: 100%;
  height: 280px;
  overflow: hidden;
  margin-bottom: 20px;
  background: linear-gradient(160deg, #1e293b, #0f172a);
}
.cover img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
.cover-empty {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  color: rgba(255,255,255,0.45);
  font-size: 13px;
  font-style: italic;
  text-align: center;
  padding: 0 24px;
}
.cover-overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, rgba(15,23,42,0.15) 0%, rgba(15,23,42,0.72) 100%);
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  padding: 20px;
  color: #fff;
}
.cover-overlay .overline { color: rgba(255,255,255,0.75); }
.cover-overlay .overline { font-size: 13px; }
.cover-dates {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 8px;
}
.cover-dates .overline { margin-bottom: 0; }
.cover-dates-icon { font-size: 16px; line-height: 1; }
.cover-overlay h1 {
  color: #fff;
  font-size: 40px;
  line-height: 1.05;
  margin-bottom: 8px;
}
.cover-overlay > p {
  color: rgba(255,255,255,0.85);
  font-size: 18px;
  line-height: 1.35;
}
.cover-overlay .ph { color: rgba(255,255,255,0.6); }

/* ─── Cards ─── */
.card {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow-sm);
  transition: box-shadow 0.2s, transform 0.2s;
}
.card:hover { box-shadow: var(--shadow-md); }
.card-lift { cursor: pointer; text-align: start; width: 100%; font-family: var(--font); color: inherit; }
.card-lift:hover { transform: translateY(-2px); }

.day-card {
  display: flex;
  gap: 8px;
  padding: 14px 14px 14px 16px;
  margin-bottom: 10px;
  align-items: flex-start;
}
.day-card-body { flex: 1; min-width: 0; }
.day-card h3 { margin-bottom: 0; }
.day-card-head {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  margin-bottom: 4px;
}
.day-card-head .day-card-tags {
  margin-top: 0;
}
.day-card p {
  font-size: 15px;
  color: var(--muted);
  line-height: 1.55;
}
.day-card-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  margin-top: 9px;
}
.day-card-tags:empty { display: none; }
.day-card-tags .chip {
  font-size: 10px;
  padding: 3px 8px;
}
.day-card .trash-btn { align-self: center; }

.icon-btn {
  flex-shrink: 0;
  width: 28px;
  height: 28px;
  border: none;
  border-radius: 999px;
  background: transparent;
  color: var(--muted);
  font-size: 17px;
  line-height: 1;
  font-family: var(--font);
  cursor: pointer;
  opacity: 0.55;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 0;
  transition: opacity 0.15s, background 0.15s, color 0.15s;
}
.icon-btn:hover { opacity: 1; background: #fee2e2; color: #b91c1c; }
.trash-icon {
  width: 15px;
  height: 15px;
  display: block;
}

/* ─── Buttons ─── */
.btn[hidden] { display: none; }
.btn {
  display: block;
  width: 100%;
  padding: 14px 18px;
  border: 2px solid var(--border);
  border-radius: var(--radius);
  background: var(--card-bg);
  color: var(--text);
  font-size: 15px;
  font-weight: 500;
  font-family: var(--font);
  cursor: pointer;
  text-align: left;
  margin-bottom: 10px;
  transition: all 0.15s ease;
  box-shadow: var(--shadow-sm);
}
.btn:active { transform: scale(0.98); }
.btn-primary {
  background: var(--dark);
  color: #fff;
  border-color: var(--dark);
  text-align: center;
  font-weight: 600;
  box-shadow: var(--shadow-md);
}
.btn-primary:hover { background: #1e293b; }
.btn-outline {
  background: transparent;
  border-color: var(--border);
  color: var(--text);
  text-align: center;
  font-weight: 500;
}
.btn-outline:hover { border-color: var(--muted); background: var(--light-bg); }

.back-link {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  color: var(--muted);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  margin: 16px 0 12px;
  background: none;
  border: none;
  font-family: var(--font);
  padding: 0;
}
.back-link:hover { color: var(--text); }

/* ─── Day page ─── */
.hero-day { margin-bottom: 18px; }
.day-title-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  margin-bottom: 8px;
}
.day-title-row h2 {
  margin-bottom: 0;
  flex: 0 1 auto;
}
.day-title-row .chips {
  margin: 0;
  flex: 1 1 auto;
}

.chips {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
  margin: 10px 0 18px;
}
.chip-add {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--muted);
  background: transparent;
  border: 1px dashed var(--border);
  border-radius: 999px;
  padding: 4px 10px;
  font-family: var(--font);
  cursor: pointer;
  transition: border-color 0.15s, color 0.15s;
}
.chip-add:hover { border-color: var(--blue); color: var(--blue-dark); }
.chip {
  display: inline-block;
  width: max-content;
  max-width: 100%;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--blue-dark);
  background: var(--blue-light);
  border-radius: 999px;
  padding: 4px 8px;
  white-space: nowrap;
}
.chip-shell {
  display: inline-flex;
  align-items: center;
  width: max-content;
  max-width: 100%;
  flex: 0 0 auto;
  background: var(--blue-light);
  border-radius: 999px;
}
.chip-shell .chip { padding-right: 4px; }
.chip-remove {
  width: 22px;
  height: 22px;
  margin-right: 3px;
  border: 0;
  border-radius: 999px;
  padding: 0;
  background: transparent;
  color: var(--blue-dark);
  cursor: pointer;
  opacity: 0.6;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
.chip-remove .trash-icon { width: 12px; height: 12px; }
.chip-remove:hover { opacity: 1; background: rgba(255,255,255,0.65); }
/* The photo link and the tags share the line under the cover. */
.slot-meta {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 10px;
}
.slot-meta .image-picker { margin-top: 0; }
.slot-tags {
  margin: 0;
}

.day-highlights {
  color: var(--muted);
  font-size: 16px;
  line-height: 1.6;
  margin-bottom: 8px;
}

.day-gallery {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  scroll-snap-type: x mandatory;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
  padding-bottom: 2px;
  margin: 0 0 18px;
}
.day-gallery::-webkit-scrollbar { display: none; }
.day-gallery:empty { display: none; }
.gallery-thumb {
  flex: 0 0 var(--thumb-size);
  aspect-ratio: 1 / 1;
  padding: 0;
  border: 1px solid var(--border);
  border-radius: 10px;
  overflow: hidden;
  background: var(--light-bg);
  scroll-snap-align: start;
  cursor: zoom-in;
}
.gallery-thumb img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.lightbox {
  position: fixed;
  inset: 0;
  z-index: 250;
  display: none;
  align-items: center;
  justify-content: center;
  background: rgba(9, 13, 25, 0.92);
  padding: 24px 12px;
}
.lightbox.open { display: flex; }
.lightbox img {
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
  border-radius: 12px;
}
.lightbox-btn {
  position: absolute;
  border: 0;
  border-radius: 999px;
  width: 42px;
  height: 42px;
  font-size: 20px;
  color: #0f172a;
  background: rgba(255,255,255,0.92);
  cursor: pointer;
}
.lightbox-close { top: 16px; right: 16px; }
.lightbox-prev { left: 12px; }
.lightbox-next { right: 12px; }
.lightbox-btn[hidden] { display: none; }

.timeline { display: flex; flex-direction: column; gap: 10px; }
.timeline:not(:empty) { margin-bottom: 10px; }
.slot { padding: 14px 16px; }
.slot .slot-actions { float: right; display: flex; align-items: center; gap: 2px; margin: -4px -6px 0 4px; }
.slot[dir="rtl"] .slot-actions { float: left; margin: -4px 4px 0 -6px; }
.slot[dir="rtl"] ul { margin: 8px 18px 0 0; }
.move-btn {
  width: 32px;
  height: 32px;
  border: 0;
  border-radius: 999px;
  background: transparent;
  color: var(--muted);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 0;
  opacity: 0.65;
  -webkit-user-select: none;
  user-select: none;
}
.move-btn:hover, .move-btn:focus-visible { opacity: 1; background: var(--light-bg); }
.move-btn svg { width: 16px; height: 16px; display: block; }
/* The end of the list keeps its button, greyed out, so the row of
   controls does not jump about as cards are moved. */
.move-btn:disabled {
  opacity: 0.2;
  cursor: default;
  background: transparent;
}
@media (pointer: coarse) {
  .move-btn {
    width: 42px;
    height: 42px;
  }
  .move-btn svg { width: 18px; height: 18px; }
}
.heart-btn {
  width: 28px;
  height: 28px;
  border: 0;
  border-radius: 999px;
  background: transparent;
  color: var(--muted);
  font-size: 16px;
  line-height: 1;
  cursor: pointer;
}
.heart-btn.is-on { color: var(--red); }
.heart-names {
  display: block;
  clear: both;
  margin: 8px 0 0;
  font-size: 11px;
  color: var(--muted);
}
.heart-names:empty { display: none; }

.heart-filters {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin: 0 0 14px;
}
.heart-filter {
  border: 1px solid var(--border);
  background: #fff;
  color: var(--text);
  border-radius: 999px;
  padding: 6px 12px;
  font-size: 12px;
  font-weight: 700;
  font-family: var(--font);
  cursor: pointer;
}
.heart-filter.is-on {
  background: var(--red-light);
  border-color: #fecaca;
  color: var(--red-dark);
}
.heart-item {
  padding: 14px 16px;
  margin-bottom: 10px;
  cursor: pointer;
  text-align: left;
  width: 100%;
  font-family: var(--font);
  color: inherit;
}
.heart-item .muted { font-size: 12px; color: var(--muted); margin-top: 4px; }
.heart-empty { color: var(--muted); font-size: 14px; line-height: 1.6; }
/* The photo caps the card like a cover: cropped here, full size on tap. */
.slot-image {
  position: relative;
  margin: -14px -16px 12px;
}
.slot-image[hidden] { display: none; }
.slot-image img {
  display: block;
  width: 100%;
  height: var(--cover-height);
  object-fit: cover;
  border-radius: var(--radius) var(--radius) 0 0;
  cursor: zoom-in;
}
.slot-image .image-remove {
  position: absolute;
  top: 8px;
  right: 8px;
  width: 26px;
  height: 26px;
  font-size: 15px;
  opacity: 0.95;
  background: #fff;
  box-shadow: var(--shadow-sm);
}
.slot[dir="rtl"] .slot-image .image-remove { right: auto; left: 8px; }
.image-picker {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  margin-top: 10px;
  color: var(--blue-dark);
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
}
.image-picker input { display: none; }
.slot-time {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--purple);
  margin-bottom: 4px;
}
.slot p { font-size: 16px; color: var(--text); line-height: 1.65; }
.slot ul {
  margin: 8px 0 0 18px;
  font-size: 16px;
  color: var(--text);
}
.slot li { margin-bottom: 4px; }

/* Where the activity is, on the last line of the card. */
.slot-address {

<!-- inline:maps.js -->
<script>
/* An address on a card is whatever she pastes: a typed street, a share
   sheet blob, or a bare link. Keep the readable part on the card and the
   link behind the pin. */
var URL_TOKEN = /(?:https?:\/\/|www\.)[^\s<>"'\u00ab\u00bb]+/gi;
var MAPS_URL = new RegExp(
  '^(?:https?://)?(?:www\\.)?(?:' +
    'google\\.[a-z.]{2,8}/maps' + '|' +
    'maps\\.google\\.[a-z.]{2,8}' + '|' +
    'maps\\.app\\.goo\\.gl' + '|' +
    'goo\\.gl/maps' +
  ')(?:[/?#]|$)',
  'i'
);
var SEARCH = 'https://www.google.com/maps/search/?api=1&query=';

/* A link copied out of a sentence drags the punctuation that closed it. */
function trimUrl(url) {
  return String(url || '').replace(/[)\].,;:!?'"]+$/, '');
}

function isMapsUrl(text) {
  return MAPS_URL.test(trimUrl(String(text || '').trim()));
}

function withProtocol(url) {
  return /^https?:\/\//i.test(url) ? url : 'https://' + url.replace(/^\/+/, '');
}

/* google.com/maps/place/Staubbach+Falls/@46.59,7.90 says where it is
   even before the page loads. */
function placeFromMapsUrl(url) {
  var place = String(url || '').match(/\/maps\/place\/([^/@?#]+)/i);
  var query = String(url || '').match(/[?&](?:q|query|daddr)=([^&#]+)/i);
  var raw = (place && place[1]) || (query && query[1]) || '';
  if (!raw) return '';
  var text = raw.replace(/\+/g, ' ');
  try { text = decodeURIComponent(text); } catch (e) { /* a half-escaped paste is still readable */ }
  text = text.trim();
  // Coordinates are not an address anyone reads.
  return /^-?\d+(\.\d+)?\s*,\s*-?\d+(\.\d+)?$/.test(text) ? '' : text;
}

/* Split pasted text into what she reads and what the pin opens. */
function splitMapsPaste(text) {
  var source = String(text || '').replace(/\r\n?/g, '\n');
  var mapsUrl = '';

  var rest = source.replace(URL_TOKEN, function (match) {
    var candidate = trimUrl(match);
    if (mapsUrl || !isMapsUrl(candidate)) return match;
    mapsUrl = withProtocol(candidate);
    return match.slice(candidate.length);
  });

  var address = rest
    .replace(/\(\s*\)|\[\s*\]|<\s*>/g, ' ') // the brackets the link sat in
    .split('\n')
    .map(function (line) { return line.replace(/\s{2,}/g, ' ').trim(); })
    .filter(Boolean)
    .join(', ')
    .replace(/^[\s,;|)\]]+/, '')
    .trim();

  // Lifting the link out of a sentence leaves its punctuation behind.
  if (mapsUrl) address = address.replace(/[\s,;:.|(\[]+$/, '');
  else address = address.replace(/[\s,;|(\[]+$/, '');

  if (!address && mapsUrl) address = placeFromMapsUrl(mapsUrl);
  return { address: address, mapsUrl: mapsUrl };
}

/* The pin opens the exact place when there is a link, and searches for
   the typed address when there is not. */
function mapsHref(address, mapsUrl) {
  var link = trimUrl(String(mapsUrl || '').trim());
  if (link && isMapsUrl(link)) return withProtocol(link);
  var typed = String(address || '').trim();
  return typed ? SEARCH + encodeURIComponent(typed) : '';
}

if (typeof module !== 'undefined' && module.exports) {
  module.exports = {
    isMapsUrl: isMapsUrl,
    splitMapsPaste: splitMapsPaste,
    placeFromMapsUrl: placeFromMapsUrl,
    mapsHref: mapsHref
  };
}
</script>

<script>
(function (root, factory) {

  if (typeof module === 'object' && module.exports) module.exports = api;
  else Object.assign(root, api);
})(typeof globalThis !== 'undefined' ? globalThis : this, function () {

  /* She pastes whatever she has: the whole link from the other device, or

  function planKeyFromInput(value, baseUrl) {

    var bare = cleanPlanKey(input);
    if (bare) return bare;

    var stamp = (now || Date.now()).toString(36);
    return 'lb' + stamp + r().toString(36).slice(2, 8);
  }

    cleanPlanKey: cleanPlanKey,
    planKeyFromInput: planKeyFromInput,

<script>
(function (root, factory) {
  var api = factory();
  if (typeof module === 'object' && module.exports) module.exports = api;
  else Object.assign(root, api);
})(typeof globalThis !== 'undefined' ? globalThis : this, function () {
  var HEBREW = /[\u0590-\u05FF\uFB1D-\uFB4F]/;

  function value(owner, key) {
    return owner && owner.fields && owner.fields[key] ? owner.fields[key].v : '';
  }

  function gone(owner) {
    return value(owner, 'removed') === '1';
  }

  function hasHebrew(text) {
    return HEBREW.test(String(text == null ? '' : text));
  }

  function tagsSpeakHebrew(tags) {
    return (tags || []).some(function (tag) {
      return !gone(tag) && hasHebrew(value(tag, 'text'));
    });
  }

  /* One Hebrew line anywhere in the day flips the whole day, so a
     mixed itinerary reads in one direction instead of card by card. */
  function dayDirection(day) {
    if (!day) return 'ltr';

    var own = ['name', 'highlights', 'tone'].some(function (key) {
      return hasHebrew(value(day, key));
    });
    if (own || tagsSpeakHebrew(day.chips)) return 'rtl';

    var inSlots = (day.slots || []).some(function (slot) {
      if (gone(slot)) return false;
      var text = ['time', 'title', 'detail'].some(function (key) {
        return hasHebrew(value(slot, key));
      });
      return text || tagsSpeakHebrew(slot.tags);
    });

    return inSlots ? 'rtl' : 'ltr';
  }

  return {
    hasHebrew: hasHebrew,
    dayDirection: dayDirection,
  };
});
</script>

<!-- inline:hearts.js -->
<script>
function liveHearts(slot) {
  return (slot.hearts || []).filter(function (heart) {
    return !heart.fields || !heart.fields.removed || heart.fields.removed.v !== '1';
  });
}

function userHeart(slot, userId) {
  return (slot.hearts || []).find(function (heart) {
    return heart.id === userId;
  });
}

function hasHeart(slot, userId) {
  var heart = userHeart(slot, userId);
  if (!heart) return false;
  return !heart.fields || !heart.fields.removed || heart.fields.removed.v !== '1';
}

function toggleHeart(slot, user, now) {
  now = now || Date.now();
  if (!slot.hearts) slot.hearts = [];
  var existing = userHeart(slot, user.id);
  if (!existing) {
    slot.hearts.push({
      id: user.id,
      created: now,
      fields: {
        name: { v: user.name || '', t: now },
        removed: { v: '', t: now }
      }
    });
    return true;
  }
  var on = hasHeart(slot, user.id);
  existing.fields.removed = { v: on ? '1' : '', t: now };
  if (user.name) existing.fields.name = { v: user.name, t: now };
  return !on;
}

function isRemoved(owner) {
  return !!(owner && owner.fields && owner.fields.removed && owner.fields.removed.v === '1');
}

function fieldValue(owner, key, fallback) {
  if (!owner || !owner.fields || !owner.fields[key] || !owner.fields[key].v) return fallback || '';
  return owner.fields[key].v;
}

function heartUsers(plan) {
  var byId = {};
  (plan.days || []).forEach(function (day) {
    if (isRemoved(day)) return;
    (day.slots || []).forEach(function (slot) {
      if (isRemoved(slot)) return;
      liveHearts(slot).forEach(function (heart) {
        byId[heart.id] = {
          id: heart.id,
          name: fieldValue(heart, 'name', 'Someone')
        };
      });
    });
  });
  return Object.keys(byId).map(function (id) { return byId[id]; }).sort(function (a, b) {
    return a.name.localeCompare(b.name);
  });
}

function heartList(plan, userId) {
  var items = [];
  (plan.days || []).forEach(function (day) {
    if (isRemoved(day)) return;
    (day.slots || []).forEach(function (slot) {
      if (isRemoved(slot)) return;
      var hearts = liveHearts(slot);
      if (!hearts.length) return;
      if (userId && !hearts.some(function (heart) { return heart.id === userId; })) return;
      items.push({
        dayId: day.id,
        slotId: slot.id,
        dayName: fieldValue(day, 'name', 'Untitled day'),
        title: fieldValue(slot, 'title', 'Untitled activity'),
        time: fieldValue(slot, 'time', ''),
        hearts: hearts.map(function (heart) {
          return { id: heart.id, name: fieldValue(heart, 'name', 'Someone') };
        })
      });
    });
  });
  return items;
}

function needsName(user, isShared) {
  return !!isShared && !(user && String(user.name || '').trim());
}

function saveUser(existing, name, makeId) {
  var trimmed = String(name || '').replace(/\s+/g, ' ').trim();
  if (!trimmed) return null;
  return {
    id: (existing && existing.id) || makeId(),
    name: trimmed
  };
}

if (typeof module !== 'undefined' && module.exports) {
  module.exports = {
    liveHearts: liveHearts,
    hasHeart: hasHeart,
    toggleHeart: toggleHeart,
    heartUsers: heartUsers,
    heartList: heartList,
    needsName: needsName,
    saveUser: saveUser
  };
}
</script>

<!-- inline:day-utils.js -->
<script>
/* A day nobody has typed into yet. "+ Add a day" reopens one of these
   rather than stacking a second empty card on the cover. */
function blankValue(owner, key) {
  var field = owner && owner.fields && owner.fields[key];
  return !field || !String(field.v || '').trim();
}

function stillHere(item) {
  return !(item && item.fields && item.fields.removed && item.fields.removed.v === '1');
}

function isBlankDay(day) {
  if (!day || !day.fields) return false;
  var typed = ['name', 'highlights', 'tone', 'tip'].some(function (key) {
    return !blankValue(day, key);
  });
  if (typed) return false;

  var taggedText = (day.chips || []).filter(stillHere).some(function (chip) {
    return !blankValue(chip, 'text');
  });
  if (taggedText) return false;

  return !(day.slots || []).filter(stillHere).some(function (slot) {
    var filled = ['time', 'title', 'detail', 'image', 'address', 'maps'].some(function (key) {
      return !blankValue(slot, key);
    });
    return filled || (slot.hearts || []).filter(stillHere).length > 0;
  });
}

if (typeof module !== 'undefined' && module.exports) {
  module.exports = { isBlankDay: isBlankDay };
}
</script>

<!-- inline:presence.js -->
<script>
/* Who else has this plan open right now. Each browser pings the shared
   notification topic every few seconds; a ping that stops arriving ages out. */
function notePeer(peers, peer, now) {
  if (!peer || !peer.client) return peers;
  peers[peer.client] = { name: String(peer.name || '').trim() || 'Someone', t: now || Date.now() };
  return peers;
}

function dropPeer(peers, client) {
  delete peers[client];
  return peers;
}

function activePeers(peers, now, ttl) {
  return Object.keys(peers || {})
    .filter(function (client) { return (now - peers[client].t) <= ttl; })
    .map(function (client) { return { client: client, name: peers[client].name }; })
    .sort(function (a, b) { return a.name.localeCompare(b.name); });
}

/* The push service is blocked on some phones and some Wi-Fi, and then nobody
   ever saw anybody. So who is here is also kept beside the plan, as a small
   book of client → {n: name, t: when they last said so}. */
function notePresenceBook(peers, book, options) {
  var stamps = options.stamps || {};
  Object.keys(book || {}).forEach(function (client) {
    var entry = book[client];
    if (!entry || client === options.self) return;
    var known = Object.prototype.hasOwnProperty.call(stamps, client);
    // Two devices rarely agree on the time, so a changed stamp counts as
    // "just said something" even when the clocks are far apart.
    var spoke = known && stamps[client] !== entry.t;
    stamps[client] = entry.t;
    if (spoke || Math.abs(options.now - (entry.t || 0)) <= options.ttl) {
      notePeer(peers, { client: client, name: entry.n }, options.now);
    }
  });
  return peers;
}

/* What to write back: everyone who was here recently, plus me. */
function freshBook(book, options) {
  var out = {};
  Object.keys(book || {}).forEach(function (client) {
    var entry = book[client];
    if (client === options.self) return;
    if (entry && Math.abs(options.now - (entry.t || 0)) <= options.keep) out[client] = entry;
  });
  out[options.self] = { n: options.name || 'Someone', t: options.now };
  return out;
}

function presenceLabel(peers, now, ttl) {
  var here = activePeers(peers, now, ttl);
  if (!here.length) return 'Only you';
  if (here.length === 1) return here[0].name + ' is here';
  if (here.length === 2) return here[0].name + ' and ' + here[1].name + ' are here';
  return here.length + ' people here';
}

if (typeof module !== 'undefined' && module.exports) {
  module.exports = {
    notePeer: notePeer,
    dropPeer: dropPeer,
    activePeers: activePeers,
    presenceLabel: presenceLabel,
    notePresenceBook: notePresenceBook,
    freshBook: freshBook
  };
}
</script>

  document.getElementById('nav-docs').classList.toggle('active', next.id === 'screen-docs');
  if (next.id === 'screen-hearts') renderHearts();
  if (next.id === 'screen-docs') renderDocs();
  rememberScreen(next.id);
}

/* The open page lives in the link, so a refresh comes back to it. */
function rememberScreen(screenId) {
  var url = new URL(location.href);
  url.hash = screenId === 'screen-home' ? '' : '#' + screenId.replace(/^screen-/, '');
  history.replaceState(null, '', url);
}

function restoreScreen() {
  var id = location.hash.replace(/^#/, '');
  if (!id) return;
  var target = document.getElementById('screen-' + id);
  if (!target) return; // the day may still be on its way from the other browser
  if (target.classList.contains('active')) return;
  showScreen(id);
}

/* A pasted Google Maps link is kept behind the pin, and whatever the
   share sheet said the place was called stays on the card. Anything

function wireSlotAddress(day, slot, el) {

    var split = splitMapsPaste(text);
    if (!split.mapsUrl) return;
    event.preventDefault();
    event.stopImmediatePropagation();
    set(slot, 'maps', split.mapsUrl);
    set(slot, 'address', split.address || get(slot, 'address'));

}

function fieldEls(root, attr) {
  return root.hasAttribute(attr) ? [root] : Array.prototype.slice.call(root.querySelectorAll('[' + attr + ']'));
}

function wireFields(root, owner, attr, mirror) {
  fieldEls(root, attr).forEach(function (el) {
    if (!el.isContentEditable) return;
    var key = el.getAttribute(attr);
    bindEditable(el, function () { return get(owner, key); }, function (value) {
      set(owner, key, value);
      if (mirror) mirror(key);
    });
  });
}

function paintOwner(root, owner, attr) {
  if (!root) return;
  fieldEls(root, attr).forEach(function (el) {
    paint(el, get(owner, el.getAttribute(attr)));
  });
}

/* A day name shows on both its card and its page. */
function paintDayField(day, key) {
  document.querySelectorAll(
    '[data-day="' + day.id + '"] [data-key="' + key + '"], ' +
    '[data-day="' + day.id + '"] [data-display="' + key + '"]'
  ).forEach(function (el) {
    paint(el, get(day, key));
  });
}

function paintDayCard(day) {
  var card = document.querySelector('.day-card[data-day="' + day.id + '"]');
  if (!card) return;
  card.querySelectorAll('[data-display]').forEach(function (el) {
    paint(el, get(day, el.getAttribute('data-display')));
  });
  var tags = card.querySelector('.day-card-tags');
  tags.innerHTML = '';
  dayTagTexts(day).forEach(function (text) {
    var tag = document.createElement('span');
    tag.className = 'chip';
    tag.textContent = text;
    tags.appendChild(tag);
  });
}

/* Reconcile a list of items against its DOM container, reusing
   nodes so a remote update never yanks the caret out of a field. */
function syncList(container, items, build, paintItem, idAttr, before) {
  var seen = {};
  items.forEach(function (item, i) {
    seen[item.id] = 1;
    var el = container.querySelector('[' + idAttr + '="' + item.id + '"]');
    if (!el) {
      el = build(item);
      before ? container.insertBefore(el, before) : container.appendChild(el);
    }
    var at = container.children[i];
    if (at !== el && !el.contains(document.activeElement)) container.insertBefore(el, at);
    paintItem(el, item);
  });
  container.querySelectorAll('[' + idAttr + ']').forEach(function (el) {
    if (!seen[el.getAttribute(idAttr)]) el.remove();
  });
}

function paintSlotImage(el, slot) {
  var value = get(slot, 'image');
  var wrap = el.querySelector('.slot-image');
  var image = wrap.querySelector('img');
  wrap.hidden = !value;
  resolveMedia(value, function (src) { image.src = src; });
  el.querySelector('.image-picker').firstChild.nodeValue = value ? 'Replace photo' : '＋ Add photo';
}

/* No address and no link means nothing to open, so the pin goes away
   rather than sitting there dead. */
function paintSlotAddress(el, slot) {
  var link = el.querySelector('.slot-maps');
  var href = mapsHref(get(slot, 'address'), get(slot, 'maps'));
  link.hidden = !href;
  if (href) link.setAttribute('href', href);
  else link.removeAttribute('href');
  link.textContent = get(slot, 'maps') ? '📍 Maps' : '📍 Find';
  link.title = get(slot, 'maps') ? 'Open this place in Google Maps' : 'Search Google Maps for this address';
}

function paintSlotHearts(el, slot) {
  if (!me) me = loadUser();
  var names = liveHearts(slot).map(function (heart) {
    return (heart.fields.name && heart.fields.name.v) || 'Someone';
  });
  var button = el.querySelector('.heart-btn');
  button.classList.toggle('is-on', !!(me && hasHeart(slot, me.id)));
  button.textContent = button.classList.contains('is-on') ? '♥' : '♡';
  el.querySelector('.heart-names').textContent = names.join(' · ');
}

function orderedLiveSlots(day) {
  return orderedSlots(live(day.slots));
}

/* Reordering is a tap on an arrow, not a drag: a finger sliding a tall
   card kept losing hold of it. */
function wireSlotMoves(el, day, slot) {
  wireMove(el.querySelector('.move-up'), day, slot, -1);
  wireMove(el.querySelector('.move-down'), day, slot, 1);
}

/* The card is put in its new place by a re-render, which leaves alone any
   card holding the focus. So whatever is focused — the button itself, or a
   half-typed title on the card being moved — lets go first, and the button
   takes the focus back once the move is done. Typing is saved as it happens,
   so letting go costs nothing. */
function wireMove(button, day, slot, direction) {
  var className = direction < 0 ? 'move-up' : 'move-down';
  button.onclick = function () {
    var hadFocus = document.activeElement === button;
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    moveSlot(day, slot, direction);
    if (!hadFocus) return;
    var again = document.querySelector('[data-slot="' + slot.id + '"] .' + className);
    if (again && !again.disabled) again.focus();
  };
}

/* Up and down mean earlier and later in the day, whichever way the words
   on the card happen to run. The ends of the list have nowhere to go. */
function paintSlotMoves(el, index, total) {
  el.querySelector('.move-up').disabled = index === 0;
  el.querySelector('.move-down').disabled = index === total - 1;
}

function commitSlotOrder(day, ids) {
  var slots = orderedLiveSlots(day);
  if (ids.join('|') === slots.map(function (slot) { return slot.id; }).join('|')) return;
  var values = orderValues(ids);
  slots.forEach(function (slot) {
    if (values[slot.id] && get(slot, 'order') !== values[slot.id]) set(slot, 'order', values[slot.id]);
  });
  renderDay(day);
  onEdit();
}

function openFullDayImport(screen) {
  var panel = screen.querySelector('.full-day-import');
  panel.hidden = false;
  var textarea = panel.querySelector('.full-day-text');
  setTimeout(function () { textarea.focus(); }, 0);
}

function closeFullDayImport(screen) {
  screen.querySelector('.full-day-import').hidden = true;
  screen.querySelector('.full-day-text').value = '';
}

function wireFullDayDrop(screen) {
  var textarea = screen.querySelector('.full-day-text');
  textarea.addEventListener('dragover', function (event) {
    event.preventDefault();
    textarea.classList.add('is-drop-target');
  });
  textarea.addEventListener('dragleave', function () {
    textarea.classList.remove('is-drop-target');
  });
  textarea.addEventListener('drop', function (event) {
    event.preventDefault();
    textarea.classList.remove('is-drop-target');
    var file = event.dataTransfer.files && event.dataTransfer.files[0];
    if (file && typeof file.text === 'function') {
      file.text().then(function (text) { textarea.value = text; });
      return;
    }
    var text = event.dataTransfer.getData('text/plain');
    if (text) textarea.value = text;
  });
}

function importFullDay(day, screen) {
  var textarea = screen.querySelector('.full-day-text');
  var activities = parseFullDay(textarea.value);
  if (!activities.length) {
    toast('Paste at least one activity first.');
    textarea.focus();
    return;
  }

  var existing = orderedLiveSlots(day);
  if (existing.length === 1 && isBlankActivity(existing[0])) {
    set(existing[0], 'removed', '1');
    existing = [];
  }

  activities.forEach(function (activity, index) {
    var slot = newSlot();
    set(slot, 'time', activity.time);
    set(slot, 'title', activity.title);
    set(slot, 'detail', activity.detail);
    set(slot, 'order', String((existing.length + index + 1) * 10));
    day.slots.push(slot);
  });
  closeFullDayImport(screen);
  renderDay(day);
  onEdit();
  toast(activities.length + (activities.length === 1 ? ' card created.' : ' cards created.'));
}

function moveSlot(day, slot, direction) {
  var ids = orderedLiveSlots(day).map(function (item) { return item.id; });
  commitSlotOrder(day, moveSlotIds(ids, slot.id, direction));
}

function loadUser() {
  try {
    var saved = JSON.parse(localStorage.getItem(LS_USER) || 'null');
    if (saved && saved.id && saved.name) return saved;
  } catch (e) {}
  return null;
}

function persistUser(user) {
  me = user;
  try { localStorage.setItem(LS_USER, JSON.stringify(user)); } catch (e) {}
  return user;
}

function askNameIfNeeded() {
  me = me || loadUser();
  var gate = document.getElementById('name-gate');
  if (!needsName(me, !!planKey)) {
    gate.hidden = true;
    return false;
  }
  gate.hidden = false;
  var input = document.getElementById('name-input');
  input.value = (me && me.name) || '';
  setTimeout(function () { input.focus(); }, 50);
  return true;
}

function submitName(event) {
  if (event) event.preventDefault();
  var user = saveUser(me || loadUser(), document.getElementById('name-input').value, function () { return uid('u'); });
  if (!user) {
    document.getElementById('name-input').focus();
    return;
  }
  persistUser(user);
  document.getElementById('name-gate').hidden = true;
}

function ensureUser() {
  me = me || loadUser();
  if (me && me.name) return me;
  askNameIfNeeded();
  return me && me.name ? me : null;
}

function toggleSlotHeart(day, slot) {
  if (!ensureUser()) return;
  toggleHeart(slot, me);
  renderDay(day);
  renderHearts();
  onEdit();
}

function renderHearts() {
  var filters = document.getElementById('heart-filters');
  var list = document.getElementById('heart-list');
  if (!filters || !list) return;
  var users = heartUsers(plan);
  var options = [{ id: '', name: 'All' }].concat(users);
  if (heartFilter && !users.some(function (user) { return user.id === heartFilter; })) heartFilter = '';
  filters.innerHTML = '';
  options.forEach(function (user) {
    var button = document.createElement('button');
    button.type = 'button';
    button.className = 'heart-filter' + (heartFilter === user.id ? ' is-on' : '');
    button.textContent = user.name;
    button.onclick = function () {
      heartFilter = user.id;
      renderHearts();
    };
    filters.appendChild(button);
  });
  var items = heartList(plan, heartFilter || undefined);
  list.innerHTML = '';
  if (!items.length) {
    var empty = document.createElement('p');
    empty.className = 'heart-empty';
    empty.textContent = 'No favorites yet. Open a day and tap ♡ on an activity.';
    list.appendChild(empty);
    return;
  }
  items.forEach(function (item) {
    var card = document.createElement('button');
    card.type = 'button';
    card.className = 'card heart-item';
    card.innerHTML =
      '<h3></h3>' +
      '<p class="muted"></p>';
    card.querySelector('h3').textContent = item.title;
    card.querySelector('.muted').textContent =
      (item.time ? item.time + ' · ' : '') + item.dayName + ' · ' + item.hearts.map(function (heart) { return heart.name; }).join(', ');
    card.onclick = function () { showScreen('day-' + item.dayId); };
    list.appendChild(card);
  });
}

function buildDoc(doc) {
  var el = document.createElement('div');
  el.className = 'card doc-card';
  el.setAttribute('data-doc', doc.id);
  var preview = docKind(doc) === 'image'
    ? '<img class="doc-preview" alt="">'
    : '<a class="doc-file" href="#" download></a>';
  el.innerHTML =
    trashButton('Remove this document') +
    preview +
    '<h3 contenteditable="true" data-dkey="name" data-ph="File name"></h3>' +
    '<p contenteditable="true" data-dkey="description" data-multiline="1" data-ph="What this is, and when you need it."></p>';
  wireFields(el, doc, 'data-dkey');
  var image = el.querySelector('.doc-preview');
  if (image) image.onclick = function () {
    openLightbox([{ src: image.src, alt: get(doc, 'name') || 'Document' }], 0);
  };
  el.querySelector('.trash-btn').onclick = function () {
    if (!confirmRemove('doc')) return;
    set(doc, 'removed', '1');
    renderDocs();
    onEdit();
  };
  return el;
}

function paintDoc(el, doc) {
  paintOwner(el, doc, 'data-dkey');
  var value = get(doc, 'data');
  var name = get(doc, 'name') || 'File';
  if (docKind(doc) === 'image') {
    var image = el.querySelector('.doc-preview');
    if (image) {
      image.alt = name;
      resolveMedia(value, function (src) { image.src = src; });
    }
    return;
  }
  var link = el.querySelector('.doc-file');
  if (!link) return;
  link.download = name;
  link.textContent = name;
  resolveMedia(value, function (src) { link.href = src || '#'; });
}

function renderDocs() {
  var list = document.getElementById('docs-list');
  if (!list) return;
  if (!plan.docs) plan.docs = [];
  var items = live(plan.docs);
  var empty = list.querySelector('.doc-empty');
  if (!items.length) {
    list.querySelectorAll('[data-doc]').forEach(function (el) { el.remove(); });
    if (!empty) {
      empty = document.createElement('p');
      empty.className = 'doc-empty';
      empty.textContent = 'No documents yet. Add a photo or a file you both need.';
      list.appendChild(empty);
    }
    return;
  }
  if (empty) empty.remove();
  syncList(list, items, function (doc) { return buildDoc(doc); }, paintDoc, 'data-doc');
}

function addDocFile(file, kindHint) {
  if (!file) return;
  var asImage = kindHint === 'image' || (file.type && file.type.indexOf('image/') === 0);
  if (!asImage && tooLarge(file.size * 1.37)) {   // base64 makes a file a third bigger
    toast('That file is too large to share here (max 650 KB).');
    return;
  }
  var doc = newDoc(function () { return uid('f'); });
  set(doc, 'name', file.name || (asImage ? 'Photo' : 'File'));
  set(doc, 'kind', asImage ? 'image' : 'file');
  set(doc, 'mime', file.type || '');

  function finish(dataUrl) {
    if (tooLarge(String(dataUrl || '').length)) {
      toast('That file is too large to share here (max 650 KB).');
      return;
    }
    storeMedia(dataUrl).then(function (ref) {
      set(doc, 'data', ref);
      if (!plan.docs) plan.docs = [];
      plan.docs.push(doc);
      renderDocs();
      onEdit();
    }).catch(function () {
      toast('That file could not be saved. Check your signal and try again.');
    });
  }

  if (asImage) {
    processImageFile(file, finish);
    return;
  }
  var reader = new FileReader();
  reader.onerror = function () { toast('That file could not be read.'); };
  reader.onload = function () { finish(reader.result); };
  reader.readAsDataURL(file);
}

var lightboxShots = [];
var lightboxAt = 0;

function openLightbox(shots, index) {
  lightboxShots = shots;
  lightboxAt = index;
  document.getElementById('lightbox').classList.add('open');
  paintLightbox();
}

function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  document.getElementById('lightbox-image').src = '';
}

function stepLightbox(by) {
  if (lightboxShots.length < 2) return;
  lightboxAt = (lightboxAt + by + lightboxShots.length) % lightboxShots.length;
  paintLightbox();
}

function paintLightbox() {
  var shot = lightboxShots[lightboxAt];
  if (!shot) return closeLightbox();
  var image = document.getElementById('lightbox-image');
  image.src = shot.src;
  image.alt = shot.alt;
  var many = lightboxShots.length > 1;
  document.querySelector('.lightbox-prev').hidden = !many;
  document.querySelector('.lightbox-next').hidden = !many;
}

function wireLightbox() {
  var box = document.getElementById('lightbox');
  box.onclick = function (event) { if (event.target === box) closeLightbox(); };
  box.querySelector('.lightbox-close').onclick = closeLightbox;
  box.querySelector('.lightbox-prev').onclick = function () { stepLightbox(-1); };
  box.querySelector('.lightbox-next').onclick = function () { stepLightbox(1); };
  document.addEventListener('keydown', function (event) {
    if (!box.classList.contains('open')) return;
    if (event.key === 'Escape') closeLightbox();
    if (event.key === 'ArrowLeft') stepLightbox(-1);
    if (event.key === 'ArrowRight') stepLightbox(1);
  });
}

function paintGallery(screen, day) {
  var gallery = screen.querySelector('.day-gallery');
  gallery.innerHTML = '';
  var shots = [];
  orderedLiveSlots(day).forEach(function (slot) {
    var value = get(slot, 'image');
    if (!value) return;
    shots.push({ src: '', value: value, alt: get(slot, 'title') || 'Day activity' });
  });
  shots.forEach(function (shot, index) {
    var thumb = document.createElement('button');
    thumb.type = 'button';
    thumb.className = 'gallery-thumb';
    thumb.title = shot.alt;
    thumb.setAttribute('aria-label', 'Open photo: ' + shot.alt);
    thumb.onclick = function () { openLightbox(shots, index); };
    var image = document.createElement('img');
    image.alt = shot.alt;
    resolveMedia(shot.value, function (src) {
      shot.src = src;
      image.src = src;
    });
    thumb.appendChild(image);
    gallery.appendChild(thumb);
  });
}

function renderDay(day) {
  paintDayCard(day);
  var screen = document.getElementById('screen-day-' + day.id);
  if (!screen) return;
  var dir = dayDirection(day);
  paintOwner(screen, day, 'data-key');
  syncList(
    screen.querySelector('.day-tags'),
    live(day.chips),
    function (chip) { return buildChip(day, chip); },
    function (el, chip) { paintOwner(el, chip, 'data-ckey'); },
    'data-chip',
    screen.querySelector('.chip-add')
  );
  var slots = orderedLiveSlots(day);
  syncList(
    screen.querySelector('.timeline'),
    slots,
    function (slot) { return buildSlot(day, slot); },
    function (el, slot) {
      el.setAttribute('dir', dir);
      paintOwner(el, slot, 'data-skey');
      paintSlotMoves(el, slots.indexOf(slot), slots.length);
      syncList(
        el.querySelector('.slot-tags'),
        live(slot.tags),
        function (tag) { return buildSlotTag(day, slot, tag); },
        function (tagEl, tag) { paintOwner(tagEl, tag, 'data-tkey'); },
        'data-slot-tag',
        el.querySelector('.slot-tag-add')
      );
      paintSlotImage(el, slot);
      paintSlotAddress(el, slot);
      paintSlotHearts(el, slot);
    },
    'data-slot'
  );
  paintGallery(screen, day);
}

function render() {
  var cards = document.getElementById('day-cards');
  var container = document.querySelector('.container');
  var days = live(plan.days);
  var shown = {};

  days.forEach(function (day, i) {
    shown[day.id] = 1;
    var card = cards.querySelector('[data-day="' + day.id + '"]');
    if (!card) {
      card = buildCard(day);
      cards.appendChild(card);
    }
    var screen = document.getElementById('screen-day-' + day.id);
    if (!screen) {
      screen = buildScreen(day);
      container.appendChild(screen);
    }
    if (cards.children[i] !== card && !card.contains(document.activeElement)) cards.insertBefore(card, cards.children[i]);
    renderDay(day);
  });

  cards.querySelectorAll('[data-day]').forEach(function (el) {
    if (!shown[el.getAttribute('data-day')]) el.remove();
  });
  document.querySelectorAll('.screen[data-day]').forEach(function (el) {
    if (!shown[el.getAttribute('data-day')]) {
      if (el.classList.contains('active')) showScreen('home');
      el.remove();
    }
  });
  if (!document.querySelector('.screen.active')) showScreen('home');
  if (document.getElementById('screen-hearts').classList.contains('active')) renderHearts();
  if (document.getElementById('screen-docs').classList.contains('active')) renderDocs();
}

function addDay() {
  var days = live(plan.days);
  var last = days[days.length - 1];
  if (last && isBlankDay(last)) {
    showScreen('day-' + last.id);
    return;
  }
  plan.days.push(newDay());
  render();
  onEdit();
  var added = live(plan.days);
  showScreen('day-' + added[added.length - 1].id);
}

function confirmRemove(label) {
  return confirm('Are you sure you want to remove this ' + label + '?');
}

function removeDay(day) {
  if (!confirmRemove('day')) return;
  set(day, 'removed', '1');
  render();
  onEdit();
}

function addSlot(day) {
  var slot = newSlot();
  set(slot, 'order', String((orderedLiveSlots(day).length + 1) * 10));
  day.slots.push(slot);
  renderDay(day);
  onEdit();
  var title = document.querySelector('#screen-day-' + day.id + ' [data-slot="' + slot.id + '"] [data-skey="title"]');
  if (title) title.focus();
}

function addChip(day) {
  day.chips.push(newChip());
  renderDay(day);
  onEdit();
  var added = document.querySelector('#screen-day-' + day.id + ' .day-tags [data-chip]:last-of-type .chip');
  if (added) added.focus();
}

function addSlotTag(day, slot) {
  if (!slot.tags) slot.tags = [];
  var tag = newChip();
  slot.tags.push(tag);
  renderDay(day);
  onEdit();
  var added = document.querySelector(
    '#screen-day-' + day.id + ' [data-slot="' + slot.id + '"] [data-slot-tag="' + tag.id + '"] .chip'
  );

function removeItem(day, item) {
  set(item, 'removed', '1');
  renderDay(day);
  onEdit();
}

/* Shared plans store images as compact data URLs. Resizing here keeps
   localStorage and live sync usable even when a phone photo is large. */
function processImageFile(file, done) {
  if (!file.type || file.type.indexOf('image/') !== 0) {
    toast('Please choose an image file.');
    return;
  }
  var reader = new FileReader();
  reader.onerror = function () { toast('That image could not be read.'); };
  reader.onload = function () {
    var source = new Image();
    source.onerror = function () { toast('That image could not be opened.'); };
    source.onload = function () {
      var max = 720;
      var scale = Math.min(1, max / Math.max(source.width, source.height));
      var canvas = document.createElement('canvas');
      canvas.width = Math.max(1, Math.round(source.width * scale));
      canvas.height = Math.max(1, Math.round(source.height * scale));
      var context = canvas.getContext('2d');
      context.fillStyle = '#ffffff';
      context.fillRect(0, 0, canvas.width, canvas.height);
      context.drawImage(source, 0, 0, canvas.width, canvas.height);
      done(canvas.toDataURL('image/jpeg', 0.62));
    };
    source.src = reader.result;
  };
  reader.readAsDataURL(file);
}

/* ─── Photos ────────────────────────────────────────────── */

/* Fetched photos are kept for the session, and on this device between
   visits, so a day page doesn't re-download its pictures every time. */
var mediaCache = {};
var mediaWaiting = {};

function cachedMedia(key) {
  if (mediaCache[key]) return mediaCache[key];
  try {
    var saved = localStorage.getItem(cacheKey(key));
    if (saved) mediaCache[key] = saved;
    return saved || '';
  } catch (e) { return ''; }
}

function rememberMedia(key, dataUrl) {
  mediaCache[key] = dataUrl;
  try { localStorage.setItem(cacheKey(key), dataUrl); } catch (e) {}
}

/* Put one photo at its own address and hand back the short reference. */
async function storeMedia(dataUrl) {
  if (tooBigToSync(dataUrl)) throw new Error('photo too large');
  var key = newMediaKey();
  var res = await fetch(STORE + key, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain' },
    body: dataUrl
  });
  if (!res.ok) throw new Error('photo upload failed');
  rememberMedia(key, dataUrl);
  return asRef(key);
}

/* Hands back a src straight away when it can, and calls again once a
   photo has arrived from its own address. */
function resolveMedia(value, done) {
  if (!value) return done('');
  if (isInline(value)) return done(value);
  var key = refKey(value);
  if (!key) return done('');
  var hit = cachedMedia(key);
  if (hit) return done(hit);
  if (!mediaWaiting[key]) {
    mediaWaiting[key] = fetch(STORE + key + '?t=' + Date.now(), { cache: 'no-store' })
      .then(function (res) { return res.ok ? res.text() : ''; })
      .then(function (text) {
        if (text) rememberMedia(key, text);
        return text;
      })
      .catch(function () { return ''; });
  }
  done('');
  mediaWaiting[key].then(function (text) { if (text) done(text); });
}

/* A photo picked before this change is still inside the plan; move it out
   so the plan shrinks back to text and starts saving again. */
async function liftPhotosOut() {
  var pending = inlineMedia(plan);
  if (!pending.length) return;
  var moved = 0;
  for (var i = 0; i < pending.length; i++) {
    try {
      var ref = await storeMedia(pending[i].item.fields[pending[i].key].v);
      set(pending[i].item, pending[i].key, ref);
      moved++;
    } catch (e) { /* leave it inline and try again next visit */ }
  }
  if (!moved) return;
  render();
  onEdit();
}

/* ─── Sync ──────────────────────────────────────────────── */

/* The header shows company, not plumbing: who else has the page open.
   It only falls back to a connection word when something is wrong. */
function status(state, text) {
  connection = { state: state || '', text: text || '' };
  paintPresence();
}

function paintPresence() {
  var pill = document.getElementById('sync-pill');
  if (!pill) return;
  pill.hidden = !planKey;
  var broken = connection.state === 'offline';
  pill.className = 'sync-pill' + (broken ? ' is-offline' : (activePeers(peers, Date.now(), PRESENCE_TTL).length ? ' is-together' : ''));
  document.getElementById('sync-text').textContent = broken
    ? connection.text
    : presenceLabel(peers, Date.now(), PRESENCE_TTL);
}

function toast(msg) {
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(function () { el.classList.remove('show'); }, 3600);
}

function saveLocal() {
  if (!planKey) return;
  try { localStorage.setItem(planCacheKey(planKey), JSON.stringify(plan)); } catch (e) {
    toast('This plan is getting too large for this phone. Try a smaller file.');
  }
}

function onEdit() {
  dirty = true;
  saveLocal();
  if (planKey) status('saving', 'Saving…');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(sync, 400);
}

function shareUrl() {
  var u = new URL(location.href);
  if (planKey) u.searchParams.set('p', planKey);
  return u.toString();
}

/* ─── Which plan am I looking at ─────────────────────────────
   One empty page that looks exactly like the trip is how a plan
   seems to vanish, so the plan is always named in the header and
   a new one is only ever made when someone asks for one.
───────────────────────────────────────────────────────────── */

function planCacheKey(key) { return LS_PLAN + '-' + key; }

function knownPlanKeys() {
  try {
    var list = JSON.parse(localStorage.getItem(LS_KNOWN) || '[]');
    if (!Array.isArray(list)) return [];
    return list.map(cleanPlanKey).filter(Boolean);
  } catch (e) { return []; }
}

function rememberPlanKey(key) {
  var list = knownPlanKeys().filter(function (other) { return other !== key; });
  list.unshift(key);
  try { localStorage.setItem(LS_KNOWN, JSON.stringify(list.slice(0, 8))); } catch (e) {}
}

/* Each plan keeps its own copy on this device, so opening the other
   person's link can never push this device's plan into theirs. */
function loadLocalPlan(key) {
  var raw = '';
  try {
    raw = localStorage.getItem(planCacheKey(key)) || '';
    // A plan saved before plans were kept apart belongs to the key this device had.
    if (!raw && localStorage.getItem(LS_ID) === key) {
      raw = localStorage.getItem(LS_PLAN) || '';
      if (raw) localStorage.removeItem(LS_PLAN);
    }
  } catch (e) {}
  if (!raw) return null;
  try {
    var saved = JSON.parse(raw);
    if (!saved || !Array.isArray(saved.days) || !saved.days.length || !saved.days[0].fields) return null;
    saved.days = saved.days.map(upgradeDay);
    if (!Array.isArray(saved.docs)) saved.docs = [];
    return saved;
  } catch (e) { return null; }
}

function setPlanKey(key) {
  if (stream) {
    try { stream.close(); } catch (e) {}
    stream = null;
  }
  peers = {};
  presenceStamps = {};
  planKey = key;
  try { localStorage.setItem(LS_ID, key); } catch (e) {}
  rememberPlanKey(key);
  var u = new URL(location.href);
  u.searchParams.set('p', key);
  history.replaceState(null, '', u);
  paintPlanCode();
  paintPresence();
  listen();
}

function paintPlanCode() {
  var button = document.getElementById('plan-code');
  if (!button) return;
  var code = planCode(planKey);
  button.hidden = !code;
  button.textContent = 'Plan ' + code;
  button.title = 'You are looking at plan ' + code + '. Tap to copy its link or open another plan.';
}

function showPlanGate(firstVisit) {
  var gate = document.getElementById('plan-gate');
  if (!gate) return;
  var code = planCode(planKey);
  gate.querySelector('#plan-gate-title').textContent = code ? 'Plan ' + code : 'Open your travel plan';
  gate.querySelector('#plan-gate-help').textContent = code
    ? 'This is the plan this device is showing. To see another one, paste its link below.'
    : 'Nothing is saved on this device yet. Paste the plan link from your other phone or computer to see the same trip.';
  var current = gate.querySelector('#plan-current');
  current.hidden = !code;
  current.textContent = code ? 'Showing plan ' + code : '';

  var others = knownPlanKeys().filter(function (key) { return key !== planKey; });
  var list = gate.querySelector('#plan-known');
  list.innerHTML = '';
  list.hidden = !others.length;
  others.forEach(function (key) {
    var button = document.createElement('button');
    button.type = 'button';
    button.textContent = 'Plan ' + planCode(key);
    button.onclick = function () { switchToPlan(key); };
    list.appendChild(button);
  });

  gate.querySelector('#copy-plan-link').hidden = !code;
  gate.querySelector('#close-plan-gate').hidden = !code;
  // A fresh plan is offered only when there is nothing else to open,
  // so nobody makes one by mistake and loses sight of the real trip.
  gate.querySelector('#new-plan-choice').hidden = !firstVisit;
  gate.querySelector('#new-plan-button').hidden = !firstVisit;
  gate.querySelector('#plan-link-input').value = '';
  gate.hidden = false;
  setTimeout(function () { gate.querySelector('#plan-link-input').focus(); }, 0);
}

function hidePlanGate() {
  var gate = document.getElementById('plan-gate');
  if (gate && planKey) gate.hidden = true;
}

function openEnteredPlan(event) {
  event.preventDefault();
  var input = document.getElementById('plan-link-input');
  var key = planKeyFromInput(input.value, location.href);
  if (!key) {
    toast('That does not look like a plan link. Use Copy link on the other device and paste the whole thing.');
    input.focus();
    return;
  }
  if (key === planKey) {
    hidePlanGate();
    return;
  }
  switchToPlan(key);
}

function startNewPlan() {
  switchToPlan(makePlanKey());
  toast('This is a brand new empty plan. Use Copy link to open it on your other device.');
}

async function switchToPlan(key) {
  var cached = loadLocalPlan(key);
  plan = cached || newPlan();
  document.getElementById('plan-gate').hidden = true;
  paintCover();
  render();
  status('saving', 'Connecting…');
  setPlanKey(key);
  dirty = !!cached;
  await sync();
  liftPhotosOut();
  askNameIfNeeded();
  startPresence();
  sharePresence();
}

async function readRemote() {
  var res = await fetch(STORE + planKey + '?t=' + Date.now(), { cache: 'no-store' });
  if (!res.ok) throw new Error('read failed');
  var text = await res.text();
  if (!text) return null; // nothing saved under this link yet
  try { return JSON.parse(text); } catch (e) { return null; }
}

async function writeRemote() {
  var body = JSON.stringify(plan);
  if (tooBigToSync(body)) {
    var big = new Error('plan too large');
    big.tooLarge = true;
    throw big;
  }
  var res = await fetch(STORE + planKey, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain' },
    body: body
  });
  if (!res.ok) {
    var failed = new Error('write failed');
    if (res.status === 413) failed.tooLarge = true;
    throw failed;
  }
  // Nudge the other browser so it reloads immediately instead of waiting for the next poll.
  signal('edit');
}

/* One tiny message carries both "I'm here" and "I just saved". */
function signal(kind, keepalive) {
  if (!planKey) return;
  var body = JSON.stringify({ c: CLIENT, n: (me && me.name) || '', k: kind });
  fetch(SIGNAL + topic() + '?cache=no', { method: 'POST', body: body, keepalive: !!keepalive }).catch(function () {});
}

function sendPing() {
  signal('ping');
}

/* One pass: read what the other person wrote, merge it into ours,
   and write back when we have local edits. */
async function sync() {
  if (!planKey || syncing) return;
  syncing = true;
  try {
    var merged = mergePlans(plan, await readRemote());
    if (JSON.stringify(merged) !== JSON.stringify(plan)) {
      plan = merged;
      paintCover();
      render();
      saveLocal();
    }
    if (dirty) {
      dirty = false;
      await writeRemote();
    }
    status('', 'Live');
    warnedTooLarge = false;
  } catch (e) {
    dirty = true;
    if (e && e.tooLarge) {
      status('offline', 'Not saved');
      // Say it once per episode, not on every retry.
      if (!warnedTooLarge) {
        warnedTooLarge = true;
        toast(sizeWarning(JSON.stringify(plan)));
      }
    } else {
      status('offline', 'Offline');
    }
  } finally {
    syncing = false;
  }
}

function topic() {
  return 'lbplan-' + planKey;
}

/* Server-sent events: the other person's save arrives as a push,
   so their words land here in about a second. */
function listen() {
  if (!planKey || stream) return;
  stream = new EventSource(SIGNAL + topic() + '/sse');
  stream.onopen = function () {
    status('', '');
    sendPing();
  };
  stream.onmessage = function (e) {
    var msg = null;
    try { msg = JSON.parse(e.data); } catch (err) { return; }
    if (!msg || msg.event !== 'message') return;

    var note = null;
    try { note = JSON.parse(msg.message); } catch (err) { note = null; }
    if (!note || !note.c || note.c === CLIENT) return;

    if (note.k === 'bye') dropPeer(peers, note.c);
    else notePeer(peers, { client: note.c, name: note.n }, Date.now());
    paintPresence();

    if (note.k === 'edit') sync();
    else if (note.k === 'hello') sendPing();
  };
  // The push service is blocked on some networks. The plan and the names
  // still travel through the store, so this is not worth worrying her about.
  stream.onerror = function () { if (connection.state !== 'offline') status('', ''); };
}

/* Who is here rides on the same store as the plan. The push service is
   blocked on some phones and some Wi-Fi, and when it is, the header used to
   say "Only you" forever even with both of you on the page. */
function whoKey() { return planKey + '-who'; }

async function sharePresence() {
  if (!planKey) return;
  var book = {};
  try {
    var res = await fetch(STORE + whoKey() + '?t=' + Date.now(), { cache: 'no-store' });
    if (res.ok) {
      var text = await res.text();
      if (text) book = JSON.parse(text) || {};
    }
  } catch (e) { book = {}; }

  notePresenceBook(peers, book, { self: CLIENT, now: Date.now(), ttl: PRESENCE_TTL, stamps: presenceStamps });
  paintPresence();

  var next = freshBook(book, {
    self: CLIENT,
    name: (me && me.name) || 'Someone',
    now: Date.now(),
    keep: PRESENCE_KEEP
  });
  try {
    await fetch(STORE + whoKey(), {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify(next)
    });
  } catch (e) {}
}

function startPresence() {
  if (presenceTimer) return;
  signal('hello');
  sharePresence();
  presenceTimer = setInterval(function () {
    sendPing();
    sharePresence();
  }, PRESENCE_MS);
  setInterval(paintPresence, PRESENCE_MS);
  window.addEventListener('pagehide', function () { signal('bye', true); });
}

async function copyLink() {
  var url = shareUrl();
  try {
    await navigator.clipboard.writeText(url);
    toast('Link copied. Anyone with it can edit this plan with you.');
    return;
  } catch (e) {}
  // Older phone browsers refuse the clipboard API outside a secure page.
  var field = document.createElement('textarea');
  field.value = url;
  field.setAttribute('readonly', '');
  field.style.position = 'fixed';
  field.style.opacity = '0';
  document.body.appendChild(field);
  field.select();
  var copied = false;
  try { copied = document.execCommand('copy'); } catch (e) {}
  document.body.removeChild(field);
  toast(copied ? 'Link copied. Anyone with it can edit this plan with you.' : url);
}

async function init() {
  COVER_FIELDS.forEach(function (key) {
    var el = document.querySelector('[data-field="' + key + '"]');
    bindEditable(el, function () { return get(plan, key); }, function (value) { set(plan, key, value); });
  });

  wireLightbox();

  document.getElementById('docs-image-input').onchange = function (event) {
    var file = event.target.files && event.target.files[0];
    event.target.value = '';
    addDocFile(file, 'image');
  };
  document.getElementById('docs-file-input').onchange = function (event) {
    var file = event.target.files && event.target.files[0];
    event.target.value = '';
    addDocFile(file, 'file');
  };

  var params = new URLSearchParams(location.search);
  var urlKey = cleanPlanKey(params.get('p'));
  var storedKey = cleanPlanKey(localStorage.getItem(LS_ID));

  // No link and nothing saved here: say so instead of quietly starting an
  // empty plan that is impossible to tell apart from a plan that went missing.
  if (!urlKey && !storedKey) {
    paintCover();
    render();
    showPlanGate(true);
    setInterval(sync, POLL_MS);
    window.addEventListener('focus', sync);
    return;
  }

  var key = urlKey || storedKey;
  var cached = loadLocalPlan(key);
  if (cached) plan = cached;

  paintCover();
  render();
  restoreScreen();

  status('saving', 'Connecting…');
  setPlanKey(key);
  dirty = !!cached;
  await sync();
  restoreScreen();
  if (urlKey && storedKey && urlKey !== storedKey) {
    toast('You are now on plan ' + planCode(urlKey) + '. Plan ' + planCode(storedKey) +
      ' is still saved here — tap the plan code to go back to it.');
  }
  liftPhotosOut();
  askNameIfNeeded();
  startPresence();

  setInterval(sync, POLL_MS);
  window.addEventListener('focus', sync);
}

init();
</script>
</body>
</html>
